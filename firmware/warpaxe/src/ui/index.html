<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="color-scheme" content="dark">
<title>WarpAxe</title>
<link rel="icon" type="image/svg+xml" href="/assets/favicon.svg">
<style>
@font-face{font-family:Inter;src:url(/assets/inter.woff2) format("woff2");font-weight:100 900;font-display:swap}
@font-face{font-family:"Space Grotesk";src:url(/assets/space-grotesk-700.woff2) format("woff2");font-weight:700;font-display:swap}
@font-face{font-family:"JetBrains Mono";src:url(/assets/jetbrains-mono-400.woff2) format("woff2");font-weight:400;font-display:swap}
:root{--void:#05060B;--deep:#0F1226;--warp:#7B5CFF;--plasma:#00E0FF;--btc:#F7931A;--fg:#E8EEF7;--mute:#9CA8BD;--dim:#8A93AE;--ok:#50E3A4;--warn:#F5B942;--err:#FF5A5A;--line:rgba(255,255,255,.08);--card:rgba(15,18,38,.78)}
*{box-sizing:border-box}
html{background:var(--void)}
body{margin:0;min-height:100vh;color:var(--fg);font:15px/1.5 Inter,-apple-system,system-ui,sans-serif;background:radial-gradient(ellipse 80% 45% at 50% -10%,rgba(123,92,255,.16),transparent 60%),radial-gradient(ellipse 60% 40% at 50% 105%,rgba(0,224,255,.07),transparent 60%),var(--void);background-attachment:fixed;-webkit-font-smoothing:antialiased}
a{color:var(--plasma);text-decoration:none}
h1,h2{font-family:"Space Grotesk",Inter,sans-serif;letter-spacing:-.02em;margin:0}
h2{font-size:18px}
.num{font-family:"JetBrains Mono",ui-monospace,monospace;font-variant-numeric:tabular-nums}
.mute{color:var(--mute)}.dim{color:var(--dim)}
.ok{color:var(--ok)}.warn{color:var(--warn)}.err{color:var(--err)}
header{display:flex;align-items:center;gap:20px;padding:14px 28px;border-bottom:1px solid var(--line);background:rgba(5,6,11,.6);position:sticky;top:0;z-index:5;backdrop-filter:blur(8px)}
header img{height:40px;width:auto;display:block}
nav{display:flex;gap:4px;overflow-x:auto}
nav a{padding:8px 14px;border-radius:10px;color:var(--mute);font-weight:500;font-size:14px;white-space:nowrap}
nav a.on{background:rgba(123,92,255,.18);color:var(--fg);font-weight:600}
.grow{flex:1}
.pill{display:inline-flex;align-items:center;gap:8px;padding:6px 12px;border-radius:999px;font-size:13px;font-weight:600;white-space:nowrap}
.pill::before{content:"";width:8px;height:8px;border-radius:50%;background:currentColor}
select,input,button{font:inherit}
.lang{height:36px;padding:0 8px;border-radius:10px;border:1px solid rgba(255,255,255,.12);background:transparent;color:var(--fg)}
#sf{display:flex;flex-direction:column;gap:18px}
main{max-width:1280px;margin:0 auto;padding:24px 28px 48px;display:flex;flex-direction:column;gap:18px}
.card{background:var(--card);border:1px solid var(--line);border-radius:16px;padding:20px}
.lbl{font-size:12px;letter-spacing:.06em;text-transform:uppercase;color:var(--mute);font-weight:600}
.g4{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:16px}
.g3{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:16px}
.g2{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:16px}
.span2{grid-column:span 2}
.plate{display:flex;align-items:center;gap:26px;position:relative;overflow:hidden;padding:22px 26px}
.plate .stripe{position:absolute;left:0;top:0;bottom:0;width:6px}
.chips{display:grid;gap:8px}
.chip{border-radius:8px;border:1px solid;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:3px;background:rgba(255,255,255,.03)}
.chip span:first-child{font-size:11px;color:var(--mute)}
.chip i{width:8px;height:8px;border-radius:50%}
.fam{padding:4px 10px;border-radius:999px;border:1px solid;font-size:12px;font-weight:600;letter-spacing:.04em}
.meta{display:grid;grid-template-columns:repeat(3,auto);gap:28px;text-align:right}
.kpi .v{display:flex;align-items:baseline;gap:6px;margin-top:10px}
.kpi .v b{font:500 32px "JetBrains Mono",monospace}
.kpi .s{font-size:13px;color:var(--dim);margin-top:6px}
.row{display:flex;justify-content:space-between;align-items:baseline;gap:12px;padding:9px 0;border-top:1px solid rgba(255,255,255,.06);font-size:14px}
.row:first-of-type{border-top:0}
.bar{position:relative;height:10px;border-radius:5px;background:rgba(255,255,255,.07)}
.bar .f{position:absolute;left:0;top:0;bottom:0;border-radius:5px}
.bar .m{position:absolute;top:-4px;bottom:-4px;width:2px}
.fanbar{height:6px;border-radius:3px;background:rgba(255,255,255,.07);margin-top:6px}
.fanbar div{height:6px;border-radius:3px;background:linear-gradient(90deg,var(--warp),var(--plasma))}
.seg button{padding:6px 10px;border-radius:8px;border:0;background:transparent;color:var(--mute);font-size:12px;cursor:pointer}
.seg button.on{background:rgba(123,92,255,.2);color:var(--fg);font-weight:600}
.legend{display:flex;align-items:center;gap:6px;font-size:12px;color:var(--mute)}
.form{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:16px}
label.f{display:flex;flex-direction:column;gap:6px;font-size:13px;color:var(--mute)}
label.f input,label.f select{height:42px;padding:0 12px;border-radius:10px;border:1px solid rgba(255,255,255,.12);background:rgba(5,6,11,.6);color:var(--fg);font-family:"JetBrains Mono",monospace;font-size:15px}
label.f small{font-size:12px;color:var(--dim)}
label.t{display:flex;align-items:center;justify-content:space-between;gap:16px;min-height:44px;font-size:14px;cursor:pointer}
label.t small{display:block;font-size:12px;color:var(--dim)}
details.card>summary{list-style:none;cursor:pointer;display:flex;justify-content:space-between;align-items:baseline;gap:12px;flex-wrap:wrap}
details.card>summary::-webkit-details-marker{display:none}
details.card>summary h2::before{content:"▸ ";color:var(--dim)}
details.card[open]>summary h2::before{content:"▾ "}
details.card[open]>.form{margin-top:16px}
label.t input{appearance:none;width:44px;height:24px;border-radius:12px;background:rgba(255,255,255,.15);position:relative;flex-shrink:0;cursor:pointer;transition:background .15s}
label.t input::after{content:"";position:absolute;top:3px;left:3px;width:18px;height:18px;border-radius:50%;background:var(--fg);transition:left .15s}
label.t input:checked{background:var(--warp)}
label.t input:checked::after{left:23px}
.sec-h{margin-bottom:14px}.sec-h .dim{font-size:13px;margin-top:4px}
.btn{height:44px;padding:0 18px;border-radius:12px;border:1px solid rgba(255,255,255,.14);background:transparent;color:var(--fg);font-weight:600;font-size:14px;cursor:pointer}
.btn.pri{border:0;background:linear-gradient(135deg,var(--warp),var(--plasma));color:var(--void);font-weight:700}
.btn.dng{border-color:rgba(255,90,90,.5);background:rgba(255,90,90,.08);color:#FF8A8A}
.btn:disabled{opacity:.5;cursor:default}
.actions{display:flex;gap:12px;justify-content:flex-end;align-items:center;flex-wrap:wrap}
.note{display:flex;gap:12px;padding:12px 14px;border-radius:12px;font-size:13px}
.drop{display:flex;flex-direction:column;align-items:center;justify-content:center;gap:8px;min-height:130px;border-radius:14px;border:1.5px dashed rgba(123,92,255,.55);background:rgba(123,92,255,.06);text-align:center;padding:16px;cursor:pointer}
.drop.over{background:rgba(123,92,255,.16)}
.log{height:320px;overflow:auto;padding:14px 16px;border-radius:12px;background:#03040A;border:1px solid rgba(255,255,255,.06);font:12.5px/1.7 "JetBrains Mono",monospace;color:#C9D2E3;white-space:pre-wrap;word-break:break-word}
#toast{position:fixed;bottom:24px;left:50%;transform:translateX(-50%);padding:10px 18px;border-radius:12px;background:#141a33;border:1px solid var(--line);font-size:14px;opacity:0;transition:opacity .2s;pointer-events:none}
#toast.show{opacity:1}
@media (max-width:1100px){.hostip{display:none}.plate{flex-wrap:wrap}.meta{width:100%;text-align:left;grid-template-columns:repeat(3,minmax(0,1fr))}}
@media (max-width:960px){header{flex-wrap:wrap}nav{order:3;width:100%}.g4{grid-template-columns:repeat(2,minmax(0,1fr))}.g3{grid-template-columns:1fr}.g2{grid-template-columns:1fr}.span2{grid-column:auto}.meta{grid-template-columns:repeat(3,auto);gap:16px}}
@media (max-width:640px){header{position:static;padding:10px 16px;gap:8px 10px;flex-wrap:wrap}header img{height:30px}.pill{padding:5px 10px;font-size:12px}.lang{height:32px}nav{margin:0 -4px}nav a{padding:8px 10px}main{padding:16px}.plate{flex-wrap:wrap;gap:16px;padding:18px}.meta{text-align:left;width:100%}.form{grid-template-columns:1fr}.hostip{display:none}.kpi .v b{font-size:26px}}
</style>
</head>

  const pre = asic?.frequencyOptions?.length ? {f: asic.frequencyOptions, v: asic.voltageOptions || cp.v, df: asic.defaultFrequency, dv: asic.defaultVoltage} : cp;
  return `<form id="sf">` +
  (oc ? `<div class="note" style="background:rgba(255,90,90,.08);border:1px solid rgba(255,90,90,.35);align-items:center;flex-wrap:wrap"><b class="err">OC</b><span class="mute" style="flex:1">${t("oc_warn")}</span><button type="button" class="btn" data-act="ocoff" style="height:36px">${t("oc_off")}</button></div>` : "") +
  sec(t("tuning"), tuneHint, (oc ? fld("frequency", c.frequency, {type: "number", min: 100, max: asic?.absMaxFrequency || 1200, hint: fHint}) + fld("coreVoltage", c.coreVoltage, {type: "number", min: asic?.absMinVoltage || 700, max: asic?.absMaxVoltage || 1400, hint: vHint})
      : sel("frequency", c.frequency, pre.f, pre.df, {hint: t("oc_hint")}) + sel("coreVoltage", c.coreVoltage, pre.v, pre.dv, {hint: vHint})),
    `<div class="note" style="margin-top:16px;background:rgba(245,185,66,.08);border:1px solid rgba(245,185,66,.3)"><b class="warn">WarpTune</b><span class="mute">${t("tuner_note")}</span></div>`) +
  sec(t("fan_temp"), t(two ? "fan_temp_hint_two" : "fan_temp_hint_one"), tog("autofanspeed", c.autofanspeed, t("autofan_s")) + tog("invertfanpolarity", c.invertfanpolarity, t("invertfan_s")) + fld("pidTargetTemp", c.pidTargetTemp || i.pidTargetTemp, {type: "number", min: 35, max: 85}) + fld("overheat_temp", c.overheat_temp || i.overheat_temp, {type: "number", min: 50, max: 90, hint: t("overheat_s")}) + fld("minFanSpeed", c.minFanSpeed, {type: "number", min: 0, max: 100, hint: t("minFan_s")}) + fld("fanspeed", c.fanspeed, {type: "number", min: 0, max: 100, hint: t("fanspeed_s")})) +
  (oc ? xpSec(c, i, two) : "") +
  sec(t("display"), t("display_hint"), tog("flipscreen", c.flipscreen) + tog("invertscreen", c.invertscreen) + fld("displayTimeout", c.displayTimeout, {type: "number", min: 0, max: 1440})) +
  sec(t("network"), t("network_hint"), `<div style="grid-column:1/-1;display:flex;flex-direction:column;gap:8px"><div style="display:flex;justify-content:space-between;align-items:center"><span class="lbl">${t("found_nets")}</span><button type="button" class="btn" data-act="scan" style="height:36px">${t("scan")}</button></div><div id="nets" style="display:flex;flex-direction:column;gap:6px">${netsHtml()}</div></div>` +
    fld("ssid", c.ssid) + fld("wifiPass", "", {type: "password", hint: t("keep_pw")}) + fld("hostname", c.hostname) + `<div></div>` +
    tog("useNTP", c.useNTP, t("ntp_s")) + fld("ntpServer", c.ntpServer)) +
  actions(true) + `</form>`;
}

function xpSec(c, i, two) {
  const num = (k, v, o) => fld(k, v, Object.assign({type: "number"}, o));
  const body = (two ? tog("autofanspeed2", c.autofanspeed2, t("autofan2_s")) + `<div></div>` + num("vrTargetTemp", c.vrTargetTemp || i.vrTargetTemp, {min: 40, max: 90}) + num("manualFanSpeed2", c.manualFanSpeed2, {min: 0, max: 100, hint: t("fanspeed2_s")}) : "") +
    num("pidP", c.pidP, {min: 0, max: 100, step: "any", hint: t("pid_def", {v: 5})}) + num("pidI", c.pidI, {min: 0, max: 10, step: "any", hint: t("pid_def", {v: nf(0.1, 1)})}) + num("pidD", c.pidD, {min: 0, max: 100, step: "any", hint: t("pid_def", {v: 2})}) + `<div></div>` +
    num("stratumSuggestedDifficulty", c.stratumSuggestedDifficulty, {min: 0, hint: t("sugg_s")}) + num("jobInterval", c.jobInterval, {min: 0, max: 5000, hint: t("job_s")}) +
    `<div class="dim" style="grid-column:1/-1;font-size:13px">${t("xp_later")}</div>`;
  return `<details class="card"${xpOpen ? " open" : ""} id="xp"><summary><h2>${t("xp")}</h2><div class="dim">${t("xp_hint")}</div></summary><div class="form">${body}</div></details>`;
}
let xpOpen = false;
/* The expert section shows only with ?oc in the address, as AxeOS and
   NerdOS hide their overclock settings (…/?oc or …/#/settings?oc); it
   stays on for the browser tab once seen. */
function ocMode() {
  if (/[?&]oc(?:[=&]|$)/.test(location.search + location.hash.replace(/^[^?]*/, ""))) { try { sessionStorage.setItem("oc", "1"); } catch (e) {} return true; }
  try { return sessionStorage.getItem("oc") === "1"; } catch (e) { return false; }
}

let nets = null, scanning = false;
const rssiCol = r => r >= -67 ? "var(--ok)" : r >= -75 ? "var(--warn)" : "var(--err)";
function bars(r) { const n = r >= -60 ? 4 : r >= -70 ? 3 : r >= -80 ? 2 : 1, c = rssiCol(r); return `<span style="display:flex;align-items:flex-end;gap:2px;height:14px">${[0, 1, 2, 3].map(k => `<span style="width:3px;height:${4 + k * 3}px;border-radius:1px;background:${k < n ? c : "rgba(255,255,255,.18)"}"></span>`).join("")}</span>`; }
function netsHtml() {
  if (scanning) return `<span class="dim" style="font-size:13px">${t("scanning")}</span>`;
  if (typeof nets === "string") return `<span class="err" style="font-size:13px">${esc(nets)}</span>`;
  if (!nets) return "";
  const cur = state?.config?.ssid;
  return nets.map(n => `<button type="button" data-ssid="${esc(n.ssid)}" style="display:flex;align-items:center;gap:12px;padding:10px 12px;border-radius:10px;cursor:pointer;text-align:left;color:var(--fg);font:14px 'JetBrains Mono',monospace;${n.ssid === cur ? "background:rgba(123,92,255,.14);border:1px solid rgba(123,92,255,.4)" : "background:transparent;border:1px solid rgba(255,255,255,.06)"}"><span style="flex:1;overflow:hidden;text-overflow:ellipsis;white-space:nowrap">${esc(n.ssid)}</span><span class="dim" style="font:12px Inter,sans-serif">${esc(n.authmode)}</span>${bars(n.rssi)}<span style="font-size:12px;width:62px;text-align:right;color:${rssiCol(n.rssi)}">${n.rssi} dBm</span></button>`).join("");
}
async function scan() {
  scanning = true; const e = $("#nets"); if (e) e.innerHTML = netsHtml();
  try { nets = (await get("/api/system/wifi/scan")).networks; } catch (err) { nets = t("scan_fail") + err.message; }
  scanning = false; const e2 = $("#nets"); if (e2) e2.innerHTML = netsHtml();
}

/* ---------- system ---------- */
let logPaused = false, logText = "";
function systemPage() {
  const i = info, err = i.boardError, fine = !i.overheat_mode && !i.shutdown && !err;
  return `<div class="g2"><section class="card" style="display:flex;flex-direction:column;gap:14px"><h2>${t("fw_update")}</h2>
    <div><div class="row"><span class="mute">${t("installed")}</span><span class="num">${esc(i.version)}</span></div><div class="row"><span class="mute">${t("partition")}</span><span class="num">${esc(i.runningPartition)}</span></div></div>
    <label class="drop" id="drop"><input type="file" id="fw" accept=".bin" hidden><svg width="28" height="28" viewBox="0 0 24 24" aria-hidden="true"><path d="M12 16V4M7 9l5-5 5 5M4 20h16" fill="none" stroke="#9CA8BD" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"/></svg><span id="fwname" style="font-size:14px">${t("drop")}</span><span class="dim" style="font-size:12px">${t("drop_s")}</span></label>
    <div class="actions" style="justify-content:flex-start"><button type="button" class="btn pri" id="fwgo" disabled>${t("start_update")}</button><span id="fwmsg" class="mute" style="font-size:13px"></span></div></section>
  <section class="card" style="display:flex;flex-direction:column;gap:14px"><h2>${t("maintenance")}</h2>
    <div><div class="row"><span class="mute">${t("status")}</span><span class="${fine ? "ok" : "err"}">${fine ? t("st_fine") : esc(i.overheat_mode ? t("st_overheat") : i.shutdown ? t("st_off") : err)}</span></div><div class="row"><span class="mute">${t("last_reset")}</span><span class="num">${esc(i.resetReason)}</span></div><div class="row"><span class="mute">${t("free_heap")}</span><span class="num">${nf(i.freeHeap / 1024)} KB</span></div></div>
    <div class="g2" style="gap:10px"><button type="button" class="btn" data-act="restart">${t("restart")}</button>${i.shutdown ? `<button type="button" class="btn" data-act="on">${t("chips_on")}</button>` : `<button type="button" class="btn dng" data-act="off">${t("chips_off")}</button>`}<button type="button" class="btn" data-act="overheat" ${i.overheat_mode ? "" : "disabled"}>${t("reset_overheat")}</button><button type="button" class="btn" data-act="best">${t("reset_best")}</button></div>
    <div class="dim" style="font-size:12px">${t("maint_note")}</div></section></div>
  <section class="card" style="display:flex;flex-direction:column;gap:12px"><div style="display:flex;justify-content:space-between;align-items:center"><h2>${t("log")}</h2><div class="actions"><button type="button" class="btn" data-act="logpause">${t(logPaused ? "resume" : "pause")}</button><button type="button" class="btn" data-act="logsave">${t("download")}</button></div></div><div class="log" id="log">${esc(logText)}</div></section>`;
}
async function pollLog() {
  if (route !== "system" || logPaused) return;
  try { logText = await get("/api/v1/log"); const e = $("#log"); if (e) { const end = e.scrollTop + e.clientHeight >= e.scrollHeight - 20; e.textContent = logText; if (end) e.scrollTop = e.scrollHeight; } } catch (e) {}
}
function wireSystem() {
  const inp = $("#fw"), drop = $("#drop"), go = $("#fwgo");
  const pick = f => { if (!f) return; inp.file = f; $("#fwname").textContent = `${f.name} · ${nf(f.size / 1024)} KB`; go.disabled = false; };
  inp.onchange = () => pick(inp.files[0]);
  drop.ondragover = e => { e.preventDefault(); drop.classList.add("over"); };
  drop.ondragleave = () => drop.classList.remove("over");
  drop.ondrop = e => { e.preventDefault(); drop.classList.remove("over"); pick(e.dataTransfer.files[0]); };
  go.onclick = () => {
    const f = inp.file; if (!f) return; go.disabled = true;
    const x = new XMLHttpRequest(); x.open("POST", "/api/system/OTA");
    x.upload.onprogress = e => { if (e.lengthComputable) $("#fwmsg").textContent = t("uploading", {p: Math.round(e.loaded / e.total * 100)}); };
    x.onload = () => { if (x.status < 300) { $("#fwmsg").textContent = t("flashing"); setTimeout(() => location.reload(), 45000); } else { $("#fwmsg").textContent = t("failed") + x.responseText; go.disabled = false; } };
    x.onerror = () => { $("#fwmsg").textContent = t("failed") + "network"; go.disabled = false; };
    x.send(f);
  };
}

/* ---------- routing, polling ---------- */
async function act(a) {
  try {
    if (a === "restart") { if (!confirm(t("ask_restart"))) return; await fetch("/api/system/restart", {method: "POST"}).catch(() => {}); toast(t("restarting")); setTimeout(() => location.reload(), 45000); return; }
    if (a === "off") { if (!confirm(t("ask_off"))) return; await post("/api/v1/chips/off"); }
    if (a === "on") await post("/api/v1/chips/on");
    if (a === "overheat") await post("/api/v1/overheat/reset");
    if (a === "best") { if (!confirm(t("ask_best"))) return; await post("/api/v1/bestdiff/reset"); }
    if (a === "ocoff") { try { sessionStorage.removeItem("oc"); } catch (e) {} history.replaceState(null, "", location.pathname + "#/settings"); render(); return; }
    if (a === "logpause") { logPaused = !logPaused; render(); return; }
    if (a === "logsave") { const b = new Blob([logText], {type: "text/plain"}); const u = URL.createObjectURL(b); const l = document.createElement("a"); l.href = u; l.download = `${info?.hostname || "warpaxe"}-log.txt`; l.click(); URL.revokeObjectURL(u); return; }
    await load(true); toast(t("saved"), "ok");
  } catch (e) { toast(t("failed") + e.message, "err"); }
}
function render() {
  header();
  const v = $("#view");
  if (!info) { v.innerHTML = ""; return; }
  const editing = document.activeElement && ["INPUT", "SELECT"].includes(document.activeElement.tagName) && v.contains(document.activeElement);
  if (editing) return; // never re-render a form under the cursor
  v.innerHTML = route === "pool" ? poolPage() : route === "settings" ? settingsPage() : route === "system" ? systemPage() : dashboard();
  const pf = $("#pf"); if (pf) pf.onsubmit = e => { e.preventDefault(); save(pf, ["stratumURL", "stratumPort", "stratumUser", "stratumPassword", "useFallbackStratum", "fallbackStratumURL", "fallbackStratumPort", "fallbackStratumUser", "fallbackStratumPassword", "stratumTLS", "fallbackStratumTLS"]); };
  const sf = $("#sf"); if (sf) sf.onsubmit = e => { e.preventDefault(); save(sf, ["hostname", "ssid", "wifiPass", "useNTP", "ntpServer", "stratumSuggestedDifficulty"]); };
  const xp = $("#xp"); if (xp) xp.ontoggle = () => { xpOpen = xp.open; };
  if (route === "system") { wireSystem(); const e = $("#log"); if (e) e.scrollTop = e.scrollHeight; }
}
async function load(full) {
  try { info = await get("/api/system/info"); } catch (e) { info = null; header(); return; }
  if (full || !state || route !== "dashboard") { try { state = await get("/api/v1/state"); } catch (e) {} }
  if (full && asic === null) { try { asic = await get("/api/system/asic"); } catch (e) { asic = false; } }
  if (route === "dashboard") { try { hist = await get(`/api/v1/history?span=${span}`); } catch (e) {} }
  if (route === "dashboard" || full) render(); else header();
}
function go() {
  route = (location.hash.match(/#\/(\w+)/) || [])[1] || "dashboard";
  if (!["dashboard", "pool", "settings", "system"].includes(route)) route = "dashboard";
  load(true).then(pollLog);
}
document.addEventListener("click", e => {
  const s = e.target.closest("[data-span]"); if (s) { span = Number(s.dataset.span); load(false); return; }
  const n = e.target.closest("[data-ssid]"); if (n) { const f = $("#sf input[name=ssid]"); if (f) { f.value = n.dataset.ssid; const p = $("#sf input[name=wifiPass]"); if (p) p.focus(); } return; }
  const a = e.target.closest("[data-act]"); if (a) { if (a.dataset.act === "scan") scan(); else act(a.dataset.act); }
});
$("#lang").onchange = e => { lang = e.target.value; try { localStorage.setItem("lang", lang); } catch (err) {} render(); };
window.addEventListener("hashchange", go);
setInterval(() => load(false), 5000);
setInterval(pollLog, 3000);
go();
</script>
</body>
</html>
