<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="color-scheme" content="dark">
<title>WarpAxe</title>
<link rel="icon" type="image/svg+xml" href="/assets/favicon.svg">
<style>
@font-face{font-family:Inter;src:url(/assets/inter.woff2) format("woff2");font-weight:100 900;font-display:swap}
@font-face{font-family:"Space Grotesk";src:url(/assets/space-grotesk-700.woff2) format("woff2");font-weight:700;font-display:swap}
@font-face{font-family:"JetBrains Mono";src:url(/assets/jetbrains-mono-400.woff2) format("woff2");font-weight:400;font-display:swap}
:root{--void:#05060B;--deep:#0F1226;--warp:#7B5CFF;--plasma:#00E0FF;--btc:#F7931A;--fg:#E8EEF7;--mute:#9CA8BD;--dim:#8A93AE;--ok:#50E3A4;--warn:#F5B942;--err:#FF5A5A;--line:rgba(255,255,255,.08);--card:rgba(15,18,38,.78)}
*{box-sizing:border-box}
[hidden]{display:none!important}
html{background:var(--void)}
/* Starfield as in dvb-WarpPool (same stars, same drift): two fixed layers under a transparent body. */
.stars{position:fixed;inset:0;z-index:-1;pointer-events:none;background:radial-gradient(2px 2px at 36% 40%,rgba(255,255,255,0.55) 0%,transparent 100%),radial-gradient(2px 2px at 45% 89%,rgba(0,224,255,0.66) 0%,transparent 100%),radial-gradient(1.5px 1.5px at 63% 37%,rgba(123,92,255,0.56) 0%,transparent 100%),radial-gradient(2px 2px at 88% 20%,rgba(255,255,255,0.42) 0%,transparent 100%),radial-gradient(2px 2px at 44% 45%,rgba(255,255,255,0.5) 0%,transparent 100%),radial-gradient(3px 3px at 6% 40%,rgba(255,255,255,0.74) 0%,transparent 100%),radial-gradient(2px 2px at 25% 12%,rgba(247,147,26,0.55) 0%,transparent 100%),radial-gradient(1.5px 1.5px at 63% 62%,rgba(255,255,255,0.5) 0%,transparent 100%),radial-gradient(1.5px 1.5px at 6% 63%,rgba(255,255,255,0.59) 0%,transparent 100%),radial-gradient(1.5px 1.5px at 33% 86%,rgba(123,92,255,0.6) 0%,transparent 100%),radial-gradient(2px 2px at 4% 59%,rgba(255,255,255,0.36) 0%,transparent 100%),radial-gradient(2px 2px at 44% 43%,rgba(255,255,255,0.59) 0%,transparent 100%),radial-gradient(2px 2px at 93% 63%,rgba(123,92,255,0.67) 0%,transparent 100%),radial-gradient(2px 2px at 70% 85%,rgba(0,224,255,0.49) 0%,transparent 100%),radial-gradient(1.5px 1.5px at 42% 63%,rgba(247,147,26,0.66) 0%,transparent 100%),radial-gradient(1.5px 1.5px at 24% 53%,rgba(255,255,255,0.54) 0%,transparent 100%),radial-gradient(2px 2px at 86% 48%,rgba(255,255,255,0.65) 0%,transparent 100%),radial-gradient(2px 2px at 97% 72%,rgba(255,255,255,0.64) 0%,transparent 100%),radial-gradient(1.5px 1.5px at 31% 92%,rgba(255,255,255,0.61) 0%,transparent 100%),radial-gradient(1.5px 1.5px at 24% 81%,rgba(255,255,255,0.54) 0%,transparent 100%),radial-gradient(1.5px 1.5px at 24% 10%,rgba(255,255,255,0.39) 0%,transparent 100%),radial-gradient(2px 2px at 50% 51%,rgba(247,147,26,0.41) 0%,transparent 100%),radial-gradient(2px 2px at 12% 79%,rgba(0,224,255,0.56) 0%,transparent 100%),radial-gradient(2.5px 2.5px at 23% 81%,rgba(255,255,255,0.85) 0%,transparent 100%),radial-gradient(1.5px 1.5px at 6% 8%,rgba(123,92,255,0.38) 0%,transparent 100%),radial-gradient(1.5px 1.5px at 51% 93%,rgba(123,92,255,0.41) 0%,transparent 100%),radial-gradient(1.5px 1.5px at 21% 66%,rgba(255,255,255,0.66) 0%,transparent 100%),radial-gradient(2px 2px at 73% 68%,rgba(123,92,255,0.64) 0%,transparent 100%),radial-gradient(2px 2px at 46% 57%,rgba(255,255,255,0.49) 0%,transparent 100%),radial-gradient(2px 2px at 41% 39%,rgba(0,224,255,0.61) 0%,transparent 100%);animation:drift 80s linear infinite;}.stars-2{background:radial-gradient(3px 3px at 28% 95%,rgba(255,255,255,0.94) 0%,transparent 100%),radial-gradient(1.5px 1.5px at 88% 71%,rgba(255,255,255,0.5) 0%,transparent 100%),radial-gradient(2px 2px at 51% 94%,rgba(123,92,255,0.48) 0%,transparent 100%),radial-gradient(3px 3px at 65% 32%,rgba(255,255,255,0.78) 0%,transparent 100%),radial-gradient(2px 2px at 57% 26%,rgba(255,255,255,0.45) 0%,transparent 100%),radial-gradient(1.5px 1.5px at 39% 61%,rgba(247,147,26,0.44) 0%,transparent 100%),radial-gradient(3px 3px at 76% 65%,rgba(255,255,255,0.84) 0%,transparent 100%),radial-gradient(1.5px 1.5px at 56% 24%,rgba(247,147,26,0.68) 0%,transparent 100%),radial-gradient(1.5px 1.5px at 56% 11%,rgba(255,255,255,0.55) 0%,transparent 100%),radial-gradient(1.5px 1.5px at 20% 34%,rgba(0,224,255,0.6) 0%,transparent 100%),radial-gradient(1.5px 1.5px at 38% 95%,rgba(255,255,255,0.41) 0%,transparent 100%),radial-gradient(1.5px 1.5px at 5% 9%,rgba(255,255,255,0.41) 0%,transparent 100%),radial-gradient(1.5px 1.5px at 36% 59%,rgba(255,255,255,0.67) 0%,transparent 100%),radial-gradient(3px 3px at 26% 16%,rgba(0,224,255,0.95) 0%,transparent 100%),radial-gradient(1.5px 1.5px at 37% 95%,rgba(255,255,255,0.51) 0%,transparent 100%),radial-gradient(2px 2px at 12% 30%,rgba(255,255,255,0.38) 0%,transparent 100%),radial-gradient(1.5px 1.5px at 77% 3%,rgba(0,224,255,0.43) 0%,transparent 100%),radial-gradient(2px 2px at 97% 43%,rgba(255,255,255,0.68) 0%,transparent 100%),radial-gradient(1.5px 1.5px at 7% 58%,rgba(0,224,255,0.38) 0%,transparent 100%),radial-gradient(2px 2px at 44% 61%,rgba(255,255,255,0.67) 0%,transparent 100%),radial-gradient(1.5px 1.5px at 90% 7%,rgba(255,255,255,0.65) 0%,transparent 100%),radial-gradient(2px 2px at 18% 56%,rgba(123,92,255,0.41) 0%,transparent 100%),radial-gradient(2.5px 2.5px at 12% 24%,rgba(123,92,255,0.83) 0%,transparent 100%),radial-gradient(2px 2px at 88% 17%,rgba(255,255,255,0.64) 0%,transparent 100%),radial-gradient(1.5px 1.5px at 41% 20%,rgba(255,255,255,0.45) 0%,transparent 100%),radial-gradient(1.5px 1.5px at 45% 20%,rgba(255,255,255,0.55) 0%,transparent 100%),radial-gradient(1.5px 1.5px at 59% 91%,rgba(247,147,26,0.49) 0%,transparent 100%),radial-gradient(1.5px 1.5px at 23% 53%,rgba(0,224,255,0.67) 0%,transparent 100%),radial-gradient(2px 2px at 78% 73%,rgba(255,255,255,0.55) 0%,transparent 100%),radial-gradient(2px 2px at 91% 36%,rgba(255,255,255,0.66) 0%,transparent 100%);animation-duration:120s;animation-direction:reverse;opacity:0.7;}@keyframes drift{from{transform:translateY(0) translateX(0);}to{transform:translateY(-20px) translateX(8px);}}@media (prefers-reduced-motion:reduce){.stars,.stars-2{animation:none;}}
.blk{position:relative;overflow:hidden;border-color:rgba(247,147,26,.55)!important;background:rgba(247,147,26,.07)!important}
.blk::before{content:"";position:absolute;inset:0;pointer-events:none;background:linear-gradient(105deg,transparent 35%,rgba(247,147,26,.2) 50%,transparent 65%);background-size:250% 100%;animation:blkSweep 3.2s ease-in-out infinite}
.blk h2{color:var(--btc);animation:blkGlow 2.4s ease-in-out infinite}
.blk i{position:absolute;top:-12px;width:6px;height:10px;border-radius:1px;pointer-events:none;animation:blkFall 3.6s linear infinite}
@keyframes blkSweep{from{background-position:150% 0}to{background-position:-50% 0}}
@keyframes blkGlow{50%{text-shadow:0 0 14px rgba(247,147,26,.75)}}
@keyframes blkFall{to{transform:translateY(190px) rotate(540deg);opacity:0}}
@media (prefers-reduced-motion:reduce){.blk::before,.blk h2,.blk i{animation:none}.blk i{display:none}}
body{margin:0;min-height:100vh;color:var(--fg);font:15px/1.5 Inter,-apple-system,system-ui,sans-serif;background:radial-gradient(ellipse 80% 45% at 50% -10%,rgba(123,92,255,.16),transparent 60%),radial-gradient(ellipse 60% 40% at 50% 105%,rgba(0,224,255,.07),transparent 60%),transparent;background-attachment:fixed;-webkit-font-smoothing:antialiased}
a{color:var(--plasma);text-decoration:none}
h1,h2{font-family:"Space Grotesk",Inter,sans-serif;letter-spacing:-.02em;margin:0}
h2{font-size:18px}
.num{font-family:"JetBrains Mono",ui-monospace,monospace;font-variant-numeric:tabular-nums}
.mute{color:var(--mute)}.dim{color:var(--dim)}
.ok{color:var(--ok)}.warn{color:var(--warn)}.err{color:var(--err)}
header{display:flex;align-items:center;gap:20px;padding:14px 28px;border-bottom:1px solid var(--line);background:rgba(5,6,11,.6);position:sticky;top:0;z-index:5;backdrop-filter:blur(8px)}
header img{height:40px;width:auto;display:block}
nav{display:flex;gap:4px;overflow-x:auto}
nav a{padding:8px 14px;border-radius:10px;color:var(--mute);font-weight:500;font-size:14px;white-space:nowrap}
nav a.on{background:rgba(123,92,255,.18);color:var(--fg);font-weight:600}
/* The tabs keep their room; name and address give way (one line, then "…"). */
.hostip{min-width:0;flex:0 1 auto;overflow:hidden;white-space:nowrap;text-overflow:ellipsis}
.grow{min-width:0}
@media (min-width:1101px){nav{flex-shrink:0}}
@media (max-width:1320px){.hostip{display:none}}
@media (max-width:1100px){header{flex-wrap:wrap}nav{order:3;width:100%}}
.grow{flex:1}
.pill{display:inline-flex;align-items:center;gap:8px;padding:6px 12px;border-radius:999px;font-size:13px;font-weight:600;white-space:nowrap}
.pill::before{content:"";width:8px;height:8px;border-radius:50%;background:currentColor}
select,input,button{font:inherit}
.lang{height:36px;padding:0 8px;border-radius:10px;border:1px solid rgba(255,255,255,.12);background:transparent;color:var(--fg)}
#sf{display:flex;flex-direction:column;gap:18px}
main{max-width:1280px;margin:0 auto;padding:24px 28px 48px;display:flex;flex-direction:column;gap:18px}
.card{background:var(--card);border:1px solid var(--line);border-radius:16px;padding:20px}
.lbl{font-size:12px;letter-spacing:.06em;text-transform:uppercase;color:var(--mute);font-weight:600}
.g4{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:16px}
.g3{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:16px}
.g2{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:16px}
.span2{grid-column:span 2}
.plate{display:flex;align-items:center;gap:26px;position:relative;overflow:hidden;padding:22px 26px}
.plate .stripe{position:absolute;left:0;top:0;bottom:0;width:6px}
.chips{display:grid;gap:8px}
.chip{border-radius:8px;border:1px solid;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:3px;background:rgba(255,255,255,.03)}
.chip span:first-child{font-size:11px;color:var(--mute)}
.chip i{width:8px;height:8px;border-radius:50%}
.fam{padding:4px 10px;border-radius:999px;border:1px solid;font-size:12px;font-weight:600;letter-spacing:.04em}
.meta{display:grid;grid-template-columns:repeat(3,auto);gap:28px;text-align:right}
.kpi .v{display:flex;align-items:baseline;gap:6px;margin-top:10px}
.kpi .v b{font:500 32px "JetBrains Mono",monospace}
.kpi .s{font-size:13px;color:var(--dim);margin-top:6px}
.row{display:flex;justify-content:space-between;align-items:baseline;gap:12px;padding:9px 0;border-top:1px solid rgba(255,255,255,.06);font-size:14px}
.row:first-of-type{border-top:0}
.bar{position:relative;height:10px;border-radius:5px;background:rgba(255,255,255,.07)}
.bar .f{position:absolute;left:0;top:0;bottom:0;border-radius:5px}
.bar .m{position:absolute;top:-4px;bottom:-4px;width:2px}
.fanbar{height:6px;border-radius:3px;background:rgba(255,255,255,.07);margin-top:6px}
.fanbar div{height:6px;border-radius:3px;background:linear-gradient(90deg,var(--warp),var(--plasma))}
.seg button{padding:6px 10px;border-radius:8px;border:0;background:transparent;color:var(--mute);font-size:12px;cursor:pointer}
.seg button.on{background:rgba(123,92,255,.2);color:var(--fg);font-weight:600}
.legend{display:flex;align-items:center;gap:6px;font-size:12px;color:var(--mute)}
.form{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:16px}
label.f{display:flex;flex-direction:column;gap:6px;font-size:13px;color:var(--mute);min-width:0}
/* A select is as wide as its longest option unless told otherwise: on a phone the cockpit's "BTC price (needs the price line below)" pushed the whole card out of the screen (Oliver, 2026-10-18). */
label.f input,label.f select{height:42px;padding:0 12px;border-radius:10px;border:1px solid rgba(255,255,255,.12);background:rgba(5,6,11,.6);color:var(--fg);font-family:"JetBrains Mono",monospace;font-size:15px;width:100%;max-width:100%;min-width:0;box-sizing:border-box}
label.f small{font-size:12px;color:var(--dim)}
label.t{display:flex;align-items:center;justify-content:space-between;gap:16px;min-height:44px;font-size:14px;cursor:pointer}
label.t small{display:block;font-size:12px;color:var(--dim)}
details.card>summary{list-style:none;cursor:pointer;display:flex;justify-content:space-between;align-items:baseline;gap:12px;flex-wrap:wrap}
details.card>summary::-webkit-details-marker{display:none}
details.card>summary h2::before{content:"▸ ";color:var(--dim)}
details.card[open]>summary h2::before{content:"▾ "}
details.card[open]>.form{margin-top:16px}
label.t input{appearance:none;width:44px;height:24px;border-radius:12px;background:rgba(255,255,255,.15);position:relative;flex-shrink:0;cursor:pointer;transition:background .15s}
label.t input::after{content:"";position:absolute;top:3px;left:3px;width:18px;height:18px;border-radius:50%;background:var(--fg);transition:left .15s}
label.t input:checked{background:var(--warp)}
label.t input:checked::after{left:23px}
.sec-h{margin-bottom:14px}.sec-h .dim{font-size:13px;margin-top:4px}
.btn{height:44px;padding:0 18px;border-radius:12px;border:1px solid rgba(255,255,255,.14);background:transparent;color:var(--fg);font-weight:600;font-size:14px;cursor:pointer}
.btn.pri{border:0;background:linear-gradient(135deg,var(--warp),var(--plasma));color:var(--void);font-weight:700}
.btn.dng{border-color:rgba(255,90,90,.5);background:rgba(255,90,90,.08);color:#FF8A8A}
.btn:disabled{opacity:.5;cursor:default}
.actions{display:flex;gap:12px;justify-content:flex-end;align-items:center;flex-wrap:wrap}
.note{display:flex;gap:12px;padding:12px 14px;border-radius:12px;font-size:13px}
.drop{display:flex;flex-direction:column;align-items:center;justify-content:center;gap:8px;min-height:130px;border-radius:14px;border:1.5px dashed rgba(123,92,255,.55);background:rgba(123,92,255,.06);text-align:center;padding:16px;cursor:pointer}
.drop.over{background:rgba(123,92,255,.16)}
.log{height:320px;overflow:auto;padding:14px 16px;border-radius:12px;background:#03040A;border:1px solid rgba(255,255,255,.06);font:12.5px/1.7 "JetBrains Mono",monospace;color:#C9D2E3;white-space:pre-wrap;word-break:break-word}
#toast{position:fixed;bottom:24px;left:50%;transform:translateX(-50%);padding:10px 18px;border-radius:12px;background:#141a33;border:1px solid var(--line);font-size:14px;opacity:0;transition:opacity .2s;pointer-events:none}
#toast.show{opacity:1}
#ask{position:fixed;inset:0;z-index:50;display:flex;align-items:center;justify-content:center;padding:16px;background:rgba(5,6,11,.72)}
#ask .box{max-width:420px;width:100%;background:var(--deep);border:1px solid var(--line);border-radius:16px;padding:20px;display:flex;flex-direction:column;gap:18px}
#ask p{margin:0;line-height:1.5}
#ask .row{display:flex;gap:10px;justify-content:flex-end;flex-wrap:wrap}
#updbar{position:sticky;top:0;z-index:20;margin:0 auto;max-width:1240px;padding:10px 18px;display:flex;flex-direction:column;gap:6px;background:#141a33;border:1px solid rgba(0,224,255,.35);border-radius:0 0 12px 12px;font-size:14px}
#updbar.ok{border-color:rgba(80,227,164,.5);color:var(--ok)}#updbar.err{border-color:rgba(255,90,90,.5);color:var(--err)}
.swhero{border:1px solid var(--line);border-radius:22px;padding:24px 26px;background:linear-gradient(135deg,rgba(123,92,255,.14),rgba(0,224,255,.05) 60%,rgba(15,18,38,.6));display:flex;flex-direction:column;gap:16px}
.swtop{display:flex;justify-content:space-between;align-items:flex-end;flex-wrap:wrap;gap:16px}
.swbig{font:700 56px/1 "Space Grotesk",Inter,sans-serif;background:linear-gradient(90deg,#fff,var(--plasma) 45%,var(--warp));-webkit-background-clip:text;background-clip:text;color:transparent}
.swunit{font:700 20px "Space Grotesk",Inter,sans-serif;color:var(--mute);margin-left:8px}
.swfacts{display:flex;gap:26px;flex-wrap:wrap}.swfacts b{display:block;font:400 19px "JetBrains Mono",monospace;margin-top:4px}
.swbeam{display:flex;height:12px;border-radius:99px;overflow:hidden;gap:3px}
.swleg{display:flex;gap:16px;flex-wrap:wrap;font-size:12px;color:var(--mute)}
.swleg i{display:inline-block;width:8px;height:8px;border-radius:50%;margin-right:6px;vertical-align:1px}
.swbar{display:flex;gap:10px;align-items:center;justify-content:space-between;flex-wrap:wrap}
.swbar>div{display:flex;gap:8px;align-items:center;flex-wrap:wrap}
.swin{height:38px;padding:0 12px;border-radius:10px;border:1px solid rgba(255,255,255,.12);background:rgba(5,6,11,.6);color:var(--fg);font-family:"JetBrains Mono",monospace;font-size:13px}
.swring{width:18px;height:18px;border-radius:50%;flex:none}
.swgrid{display:grid;grid-template-columns:repeat(auto-fill,minmax(330px,1fr));gap:14px}
.swst{position:relative;border:1px solid var(--line);border-radius:18px;background:var(--card);padding:16px 18px 14px 22px;overflow:hidden}
.swst::before{content:"";position:absolute;left:0;top:0;bottom:0;width:4px;background:var(--c)}
.swst::after{content:"";position:absolute;inset:0;background:radial-gradient(ellipse 60% 70% at 0% 0%,var(--c),transparent 70%);opacity:.08;pointer-events:none}
.swsh{display:flex;justify-content:space-between;align-items:flex-start;gap:10px}
.swname{font:700 16px "Space Grotesk",Inter,sans-serif}
.swsub{font-size:12px;color:var(--dim);font-family:"JetBrains Mono",monospace}
.swdot{display:inline-block;width:8px;height:8px;border-radius:50%;margin-right:8px;vertical-align:1px}
.swhr{font:700 28px "Space Grotesk",Inter,sans-serif;margin-top:8px}.swhr small{font-size:13px;color:var(--mute);margin-left:6px}
.swspark{width:100%;height:40px;display:block;margin:4px 0 10px}
.swg{display:grid;grid-template-columns:1fr 1fr;gap:12px;font-size:12px;color:var(--mute)}
.swt{height:6px;border-radius:99px;background:rgba(255,255,255,.07);margin-top:6px;overflow:hidden}.swt div{height:100%;border-radius:99px}
.swfoot{display:flex;justify-content:space-between;gap:10px;flex-wrap:wrap;margin-top:12px;font:12px "JetBrains Mono",monospace;color:var(--mute)}
.swic{display:flex;gap:6px;position:relative;z-index:1}.swic a,.swic button{width:28px;height:28px;border-radius:8px;border:1px solid var(--line);background:rgba(5,6,11,.5);color:var(--mute);display:inline-flex;align-items:center;justify-content:center;font-size:14px;cursor:pointer;text-decoration:none}
@media (max-width:1100px){.hostip{display:none}.plate{flex-wrap:wrap}.meta{width:100%;text-align:left;grid-template-columns:repeat(3,minmax(0,1fr))}}
@media (max-width:960px){header{flex-wrap:wrap}nav{order:3;width:100%}.g4{grid-template-columns:repeat(2,minmax(0,1fr))}.g3{grid-template-columns:1fr}.g2{grid-template-columns:1fr}.span2{grid-column:auto}.meta{grid-template-columns:repeat(3,auto);gap:16px}}
@media (max-width:640px){header{position:static;padding:10px 16px;gap:8px 10px;flex-wrap:wrap}header img{height:30px}.pill{padding:5px 10px;font-size:12px}.lang{height:32px}nav{margin:0 -4px}nav a{padding:8px 10px}main{padding:16px}.plate{flex-wrap:wrap;gap:16px;padding:18px}.meta{text-align:left;width:100%}.form{grid-template-columns:minmax(0,1fr)}.hostip{display:none}.kpi .v b{font-size:26px}}

/* dashboard, warp design (preview) */
.dh{position:relative;border:1px solid var(--line);border-radius:22px;padding:22px 26px 18px;background:linear-gradient(135deg,rgba(123,92,255,.16),rgba(0,224,255,.05) 55%,rgba(15,18,38,.62));display:flex;flex-direction:column;gap:18px;overflow:hidden}
.dh::before{content:"";position:absolute;left:0;top:0;bottom:0;width:5px;background:var(--fc)}
.dh::after{content:"";position:absolute;inset:0;background:radial-gradient(ellipse 45% 60% at 0% 0%,var(--fc),transparent 70%);opacity:.10;pointer-events:none}
.dhid{display:flex;align-items:center;gap:18px;flex-wrap:wrap;position:relative;z-index:1}
.dhchips{display:grid;gap:5px}
.dhchips i{display:block;width:16px;height:16px;border-radius:4px;border:1px solid var(--fc);background:rgba(255,255,255,.04);position:relative}
.dhchips i::after{content:"";position:absolute;inset:calc(50% - 3px);border-radius:50%;background:var(--dc)}
.dhname{display:flex;flex-direction:column;gap:4px;flex:1;min-width:180px}
.dhname h1{font-size:26px;display:flex;align-items:center;gap:12px;flex-wrap:wrap}
.dhmeta{display:flex;gap:22px;flex-wrap:wrap;font-size:13px}
.dhmeta b{display:block;font:400 15px "JetBrains Mono",monospace;margin-top:3px;color:var(--fg)}
.dhmid{display:flex;justify-content:space-between;align-items:flex-end;gap:18px 28px;flex-wrap:wrap;position:relative;z-index:1}
.dhbig{font:700 64px/1 "Space Grotesk",Inter,sans-serif;background:linear-gradient(90deg,#fff,var(--plasma) 45%,var(--warp));-webkit-background-clip:text;background-clip:text;color:transparent}
.dhsub{font-size:13px;color:var(--dim);margin-top:6px}
.dhsub .ok{color:var(--ok)}
.dhfacts{display:grid;grid-template-columns:repeat(4,auto);gap:10px 28px}
.dhfacts b{display:block;font:400 20px "JetBrains Mono",monospace;margin-top:4px}
.dhfacts small{display:block;font-size:12px;color:var(--dim);margin-top:2px}
.dhchart{position:relative;z-index:1;border-top:1px solid var(--line);padding-top:12px}
.dhchart .top{display:flex;justify-content:space-between;align-items:center;gap:12px;flex-wrap:wrap;margin-bottom:4px}
.ins{display:flex;flex-direction:column;gap:14px;min-width:0}
.ins h2{display:flex;justify-content:space-between;align-items:baseline}
.ins h2 small{font:400 12px Inter,sans-serif;color:var(--dim)}.ins h2 small.ok{color:var(--ok)}.ins h2 small.err{color:var(--err)}.ins h2 small.warn{color:var(--warn)}
.hcrow{display:grid;grid-template-columns:64px 110px minmax(0,1fr) 140px;gap:14px;align-items:center;padding:8px 0;border-top:1px solid var(--line)}.hcrow:first-of-type{border-top:0}
.hcdoms{display:grid;grid-template-columns:repeat(var(--nd,4),minmax(0,1fr));gap:6px;align-items:end}.hcdoms div{display:flex;flex-direction:column;gap:4px;min-width:0}
.hcdoms i{display:block;height:12px;border-radius:4px;background:rgba(255,255,255,.06);position:relative;overflow:hidden}.hcdoms i b{position:absolute;left:0;bottom:0;top:0;border-radius:4px}
.hcdoms span{font-size:11px;color:var(--dim);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
@media (max-width:640px){.hcrow{grid-template-columns:auto 1fr auto;row-gap:8px}.hcrow .hcdoms{grid-column:1/-1;order:4}}
.plink{display:flex;align-items:center;gap:10px;padding:12px 14px;border-radius:12px;background:rgba(0,224,255,.06);border:1px solid rgba(0,224,255,.18)}
.plink .dot{width:10px;height:10px;border-radius:50%;background:var(--ok);box-shadow:0 0 10px var(--ok)}
.plink .host{font:400 14px "JetBrains Mono",monospace;flex:1;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
@media (max-width:960px){.dhfacts{grid-template-columns:repeat(2,auto)}.dhbig{font-size:52px}}
@media (max-width:640px){.dh{padding:18px 16px 14px}.dhbig{font-size:44px}.dhfacts{grid-template-columns:repeat(2,minmax(0,1fr));width:100%}.dhmeta{width:100%}}

/* pool status and sticky save bar (preview) */
.phero{display:flex;flex-direction:column;gap:16px}
.pfacts{display:grid;grid-template-columns:repeat(5,minmax(0,1fr));gap:10px 22px;position:relative;z-index:1}
.pfacts b{display:block;font:400 19px "JetBrains Mono",monospace;margin-top:4px}
.pfacts small{display:block;font-size:12px;color:var(--dim);margin-top:2px}
.pworker{text-align:right}@media (max-width:640px){.pworker{text-align:left}}
.pay{position:relative;z-index:1;border-top:1px solid var(--line);padding-top:14px;display:flex;flex-direction:column;gap:10px}
.pay .big{font:700 34px/1 "Space Grotesk",Inter,sans-serif}
.pay .outs{display:flex;flex-direction:column;gap:6px}
.pay .out{display:flex;justify-content:space-between;gap:12px;font-size:13px;align-items:baseline}
.pay .out span:first-child{font-family:"JetBrains Mono",monospace;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
/* saved pools */
.pplist{display:flex;flex-direction:column;gap:8px;margin-top:12px}
.pprow{display:flex;justify-content:space-between;align-items:center;gap:12px;flex-wrap:wrap;padding:10px 12px;border-radius:12px;border:1px solid var(--line);background:rgba(255,255,255,.02)}
.pprow.on{border-color:var(--plasma);background:rgba(0,224,255,.05)}
.ppname{font-weight:600;display:flex;align-items:center;gap:8px;flex-wrap:wrap;overflow-wrap:anywhere}
.ppcoin,.ppact{font:500 11px "JetBrains Mono",monospace;padding:2px 7px;border-radius:999px;border:1px solid var(--line);color:var(--dim)}
.ppact{border-color:var(--plasma);color:var(--plasma)}
.ppsub{font-size:12px;margin-top:4px;overflow-wrap:anywhere}
.ppbtn{display:flex;gap:8px;flex-wrap:wrap}
.ppsave{display:flex;gap:10px;margin-top:12px;flex-wrap:wrap}
.ppsave input{flex:1 1 200px;min-width:0;height:42px;padding:0 12px;border-radius:10px;border:1px solid rgba(255,255,255,.12);background:rgba(5,6,11,.6);color:var(--fg);font-family:"JetBrains Mono",monospace;font-size:15px;box-sizing:border-box}
.actions{position:sticky;bottom:12px;z-index:5;width:fit-content;margin-left:auto;padding:10px 12px;border-radius:14px;background:rgba(10,12,24,.84);backdrop-filter:blur(8px);-webkit-backdrop-filter:blur(8px);border:1px solid var(--line)}
@media (max-width:960px){.pfacts{grid-template-columns:repeat(3,minmax(0,1fr))}}
@media (max-width:640px){.pfacts{grid-template-columns:repeat(2,minmax(0,1fr))}}

/* display settings: page list with order and start page, live view of the device's screen */
.dprow{display:flex;align-items:center;gap:12px;padding:8px 0;border-top:1px solid var(--line);font-size:14px}
.dprow:first-child{border-top:0}
.dprow>label{display:flex;align-items:center;gap:10px;cursor:pointer}
.dprow>label:first-child{flex:1}
.dprow input[type=checkbox],.dprow input[type=radio]{width:18px;height:18px;accent-color:var(--warp);margin:0}
.dpbtns{display:flex;gap:4px}
.dpbtns button{width:30px;height:30px;border-radius:8px;border:1px solid rgba(255,255,255,.12);background:transparent;color:var(--mute);cursor:pointer;font-size:14px}
.dpbtns button:disabled{opacity:.3;cursor:default}
.dpstart{font-size:12px;color:var(--dim);white-space:nowrap}
.dspv{display:flex;flex-direction:column;gap:8px;align-self:start}
.dspv canvas{width:100%;max-width:480px;image-rendering:pixelated;border-radius:8px;border:1px solid var(--line);background:#000;display:block}
.dspv canvas.oled{max-width:384px}
.swmode{display:inline-block;padding:2px 8px;border-radius:999px;font-size:11px;font-weight:600;letter-spacing:.03em;color:var(--plasma);background:rgba(0,224,255,.12);vertical-align:2px;margin-left:8px}
</style>
</head>

  const shares = live.reduce((s, r) => s + (r[1].sharesAccepted || 0), 0);
  const record = live.reduce((b, r) => typeof r[1].bestDiff === "number" && r[1].bestDiff > b ? r[1].bestDiff : b, 0);
  const f = (sw.filter || "").toLowerCase();
  const key = {hash: r => -(r[1]?.hashRate || -1), name: r => String(r[1]?.hostname || r[0]).toLowerCase(), temp: r => -(r[1]?.temp || -1)}[sw.sort] || (r => -(r[1]?.hashRate || -1));
  const shown = all.filter(([a, j]) => !f || [swHost(a), j?.hostname, j?.deviceModel, j?.ASICModel, j?.version, j?.workMode].some(x => String(x || "").toLowerCase().includes(f)))
    .sort((x, y) => { const a = key(x), b = key(y); return a < b ? -1 : a > b ? 1 : 0; });
  const byHash = live.slice().sort((x, y) => (y[1].hashRate || 0) - (x[1].hashRate || 0));
  const beam = byHash.map(([a, j]) => `<div style="flex:${Math.max(j.hashRate || 0, 1)};background:${swColor(a)}"></div>`).join("");
  const leg = byHash.map(([a, j]) => `<span><i style="background:${swColor(a)}"></i>${esc(j.hostname || swHost(a))} ${hs > 0 ? nf(j.hashRate / 10 / hs, 0) : 0}${pc()}</span>`).join("");
  const due = Math.max(0, 1 - (Date.now() - sw.last) / (sw.every * 1000));
  const ring = `<button type="button" class="btn" data-swrefresh="1" title="${t("sw_refresh")}" style="display:inline-flex;align-items:center;gap:8px"><span class="swring" id="swring" style="background:conic-gradient(var(--plasma) 0 ${Math.round(due * 100)}%,rgba(255,255,255,.1) 0)"></span>${t("sw_every", {s: sw.every})}</button>`;
  const opt = (v, k) => `<option value="${v}" ${sw.sort === v ? "selected" : ""}>${t(k)}</option>`;
  const sc = sw.scan;
  // Progress over both searches (the browser's 253 addresses and the miner's); it never steps back when the miner's total comes in late.
  if (sc) { const raw = (sc.total + (sc.cg?.total || 0)) ? Math.round((sc.done + (sc.cg?.done || 0)) / (sc.total + (sc.cg?.total || 0)) * 100) : 0; sc.pct = Math.max(sc.pct || 0, raw); }
  const pct = sc ? sc.pct : 0;
  const note = (k, n) => n ? `<div class="warn" style="font-size:12px">${t(k, {n})}</div>` : "";
  const skipped = note("sw_scan_time", sc?.cg?.skippedTime) + note("sw_scan_skipped", sc?.cg?.skippedSockets) + note("sw_scan_memory", sc?.cg?.skippedMemory) + note("sw_scan_silent", sc?.cg?.openNoAnswer);
  const scanLine = !sc ? "" : !sc.finished ? `<span class="mute">${t("sw_scanning", {a: sc.base, p: pct})}</span>`
    : sw.found.length ? `<div style="display:flex;flex-direction:column;gap:8px"><span class="lbl">${t("sw_found")}</span>${sw.found.map(x => `<div style="display:flex;gap:12px;align-items:center;flex-wrap:wrap"><span class="num">${esc(swHost(x.a))}</span>${x.j.cgminer ? `<span class="swmode" style="margin:0">${t("sw_kind_avalon")}</span>` : ""}<span class="mute">${esc(x.j.hostname || "")} · ${esc(x.j.deviceModel || x.j.ASICModel || "")} · ${esc(String(x.j.version || ""))}</span><button type="button" class="btn" data-swadd="${esc(x.a)}">${t("sw_add")}</button></div>`).join("")}${skipped}<div><button type="button" class="btn pri" data-swaddall="1">${t("sw_add_all")}</button></div></div>`
    : `<span class="mute">${t("sw_none", {a: sc.base})}</span>${skipped}`;
  return `<div style="display:flex;flex-direction:column;gap:18px">
    <section class="swhero"><div class="swtop"><div><div class="lbl">${t("sw_formation", {n: live.length})}</div><div><span class="swbig">${nf(hs, 2)}</span><span class="swunit">TH/s</span></div></div>
      <div class="swfacts"><div><span class="lbl">${t("sw_total_power")}</span><b>${nf(ws, 1)} W</b></div><div><span class="lbl">${t("sw_eff")}</span><b>${hs > 0 ? nf(ws / hs, 1) + " J/TH" : "–"}</b></div><div><span class="lbl">${t("sw_shares")}</span><b>${nf(shares)}</b></div><div><span class="lbl">${t("sw_record")}</span><b style="color:var(--btc)">${record ? swBest(record) : "–"}</b></div></div></div>
      <div class="swbeam">${beam}</div><div class="swleg">${leg}</div></section>
    <div class="swbar"><div><input id="swfilter" class="swin" placeholder="${t("sw_filter")}" value="${esc(sw.filter || "")}" autocomplete="off" style="width:180px"><select id="swsort" class="swin">${opt("hash", "sw_sort_hash")}${opt("name", "sw_sort_name")}${opt("temp", "sw_sort_temp")}</select></div>
      <div><button type="button" class="btn pri" data-swscan="1" ${sc && !sc.finished ? "disabled" : ""}>${t("sw_scan")}</button>${ring}<button type="button" class="btn" data-swaddform="1">${t("sw_add_miner")}</button></div></div>
    ${sw.addOpen ? `<form id="swf" style="display:flex;flex-direction:column;gap:8px"><div style="display:flex;gap:10px;flex-wrap:wrap"><input name="addr" class="swin" placeholder="${t("sw_add_ph")}" autocomplete="off" style="flex:1;min-width:220px"><select name="kind" class="swin"><option value="">${t("sw_kind_http")}</option><option value="cgminer:">${t("sw_kind_cg")}</option></select><button type="submit" class="btn">${t("sw_add")}</button></div><div class="dim" style="font-size:12px">${t("sw_cg_s")}</div></form>` : ""}
    ${scanLine}
    <div class="swgrid">${shown.map(([a, j, self]) => swStation(a, j, self, record)).join("")}</div>
    ${sw.members.length ? "" : `<div class="dim" style="font-size:13px;text-align:center">${t("sw_empty")}</div>`}
    <div class="dim" style="font-size:12px;text-align:center">${t("sw_hint")}</div></div>`;
}
async function swarmAdd(list) {
  const next = [...sw.members, ...list.filter(a => a && !sw.members.includes(a))];
  if (next.length > sw.max) return toast(t("sw_full", {n: sw.max}), "err");
  try { await swarmSave(next); sw.found = sw.found.filter(f => !next.includes(f.a)); toast(t("saved"), "ok"); swarmPoll(); } catch (e) { toast(t("failed") + e.message, "err"); }
}
document.addEventListener("click", async e => {
  const rm = e.target.closest("[data-swrm]"); if (rm) { try { await swarmSave(sw.members.filter(a => a !== rm.dataset.swrm)); delete sw.data[rm.dataset.swrm]; render(); } catch (er) { toast(t("failed") + er.message, "err"); } return; }
  const ad = e.target.closest("[data-swadd]"); if (ad) return swarmAdd([ad.dataset.swadd]);
  if (e.target.closest("[data-swaddall]")) return swarmAdd(sw.found.map(f => f.a));
  if (e.target.closest("[data-swscan]")) swarmScan();
  if (e.target.closest("[data-swrefresh]")) { const steps = [10, 30, 60, 120]; sw.every = steps[(steps.indexOf(sw.every) + 1) % steps.length] || 30; try { localStorage.setItem("swEvery", sw.every); } catch (er) {} swarmPoll(); }
  if (e.target.closest("[data-swaddform]")) { sw.addOpen = !sw.addOpen; render(); const i = $("#swf input"); if (i) i.focus(); }
});
document.addEventListener("submit", e => { if (e.target.id !== "swf") return; e.preventDefault(); const v = e.target.addr.value.trim(); if (v) swarmAdd([(e.target.kind.value || (swIsCg(v) ? "cgminer:" : "")) + swHost(v)]); });
setInterval(() => {
  if (route !== "swarm" || document.hidden) return;
  if (Date.now() - sw.last >= sw.every * 1000) swarmPoll();
  const r = $("#swring"); if (r) r.style.background = `conic-gradient(var(--plasma) 0 ${Math.round(Math.max(0, 1 - (Date.now() - sw.last) / (sw.every * 1000)) * 100)}%,rgba(255,255,255,.1) 0)`;
}, 1000);
document.addEventListener("input", e => {
  if (e.target.id === "swfilter") { sw.filter = e.target.value; const v = $("#view"); const pos = e.target.selectionStart; render(); const f = $("#swfilter"); if (f) { f.focus(); f.setSelectionRange(pos, pos); } }
  if (e.target.id === "swsort") { sw.sort = e.target.value; render(); }
  if (e.target.id === "swevery") { sw.every = Number(e.target.value); try { localStorage.setItem("swEvery", sw.every); } catch (er) {} e.target.parentElement.lastChild.textContent = t("sw_every", {s: sw.every}); }
});

// The firmware this page was loaded from. When the miner comes back on
// another one (an update started in another tab, by a tool or over the
// API), the page reloads so it is the new UI and not the old one.
let loadedFw = null;
async function load(full) {
  try { info = await get("/api/system/info"); infoAt = Date.now(); } catch (e) { info = null; header(); return; }
  const fw = info.gitHash || info.version;
  if (loadedFw === null) loadedFw = fw;
  else if (fw && fw !== loadedFw && !watch) {
    try { sessionStorage.setItem("wa_upd_done", String(info.version || "").replace(/^warpaxe /, "")); } catch (e) {}
    location.reload(); return;
  }
  tabTitle(info);
  if (full || !state || route !== "dashboard") { try { state = await get("/api/v1/state"); } catch (e) {} }
  if (full && asic === null) { try { asic = await get("/api/system/asic"); } catch (e) { asic = false; } }
  if (route === "dashboard") { try { hist = await get(`/api/v1/history?span=${span}`); } catch (e) {} }
  if (route === "system" && full) { try { upd = await get("/api/v1/update"); } catch (e) {} }
  if (route === "dashboard" || full) render(); else header();
}
function go() {
  route = (location.hash.match(/#\/(\w+)/) || [])[1] || (HOTSPOT ? "network" : "dashboard");
  if (!["dashboard", "swarm", "network", "pool", "settings", "system"].includes(route)) route = "dashboard";
  if (route === "swarm") swarmLoad();
  load(true).then(pollLog);
}
document.addEventListener("click", e => {
  const s = e.target.closest("[data-span]"); if (s) { span = Number(s.dataset.span); load(false); return; }
  const n = e.target.closest("[data-ssid]"); if (n) { const f = $("#sf input[name=ssid]"); if (f) { f.value = n.dataset.ssid; const p = $("#sf input[name=wifiPass]"); if (p) p.focus(); } return; }
  const dm = e.target.closest("[data-demo]"); if (dm) { post(`/api/v1/display/demo?event=${dm.dataset.demo}`).then(() => toast(t("demo_on"), "ok")).catch(er => toast(t("failed") + er.message, "err")); return; }
  const pp = e.target.closest("[data-pp]"); if (pp) { poolAct(pp.dataset.pp, pp.dataset.ppn || ""); return; }
  const a = e.target.closest("[data-act]"); if (a) { if (a.dataset.act === "scan") scan(); else if (a.dataset.act === "psuhide") { try { localStorage.setItem("psuHide", "1"); } catch (e) {} render(); } else act(a.dataset.act); }
});
$("#lang").onchange = e => { lang = e.target.value; try { localStorage.setItem("lang", lang); } catch (err) {} render(); };
window.addEventListener("hashchange", go);
try {
  const done = sessionStorage.getItem("wa_upd_done");
  if (done !== null) { sessionStorage.removeItem("wa_upd_done"); updBar(t("upd_done", {v: done}), null, "ok"); setTimeout(() => updBar(null), 15000); }
} catch (e) {}
setInterval(() => load(false), 5000);
setInterval(pollLog, 3000);
setInterval(pollSelftest, 2000);
setInterval(pollUpdate, 2000);
document.addEventListener("change", async e => {
  if (e.target.id !== "updauto") return;
  try { await post("/api/system", {updateCheck: e.target.checked}); toast(t("saved"), "ok"); await load(false); } catch (er) { toast(t("failed") + er.message, "err"); }
});
go();
</script>
</body>
</html>
