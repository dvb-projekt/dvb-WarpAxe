[build]
target = "xtensa-esp32s3-espidf"

[target.xtensa-esp32s3-espidf]
linker = "ldproxy"
runner = "espflash flash --no-skip -a watchdog-reset"
rustflags = ["--cfg", "espidf_time64"]

[unstable]
build-std = ["std", "panic_abort"]
# std without its backtrace symbolizer (gimli, addr2line, rustc-demangle,
# miniz_oxide): it needs debug info the image never carries, so on the miner
# it could only print addresses anyway, and it cost about 132 KB of the image
# (measured 2026-10-19). Panic messages and the ESP-IDF core dump stay.
build-std-features = []

[env]
MCU = "esp32s3"
ESP_IDF_VERSION = "v5.3.3"
# C code in crates (secp256k1-sys for Stratum V2) must be built with the
# ESP32-S3 wrapper: the generic xtensa-esp-elf-gcc defaults to big-endian
# and the link fails with "compiled for a big endian system".
CC_xtensa_esp32s3_espidf = "xtensa-esp32s3-elf-gcc"
AR_xtensa_esp32s3_espidf = "xtensa-esp32s3-elf-ar"
# Like every ESP-IDF object: calls may cross the flash mapping
# ("dangerous relocation: call8: call target out of range" otherwise).
CFLAGS_xtensa_esp32s3_espidf = "-mlongcalls"
