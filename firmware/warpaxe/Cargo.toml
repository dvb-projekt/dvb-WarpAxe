[package]
name = "warpaxe"
version = "0.1.28"
edition = "2021"
license = "GPL-3.0-or-later"
authors = ["dvb-projekt <oliver-mai@gmx.de>"]
description = "WarpAxe firmware for BM13xx miners on the ESP32-S3 (Bitaxe Gamma, NerdAxe/NerdQAxe family). Stage B: network over USB-C and Wi-Fi, AxeOS-compatible API, OTA, display; the chain driver from warpaxe-chain."
rust-version = "1.77"
publish = false

# Detached from the workspace on purpose: different target (xtensa), std on ESP-IDF.
[workspace]

[[bin]]
name = "warpaxe"
harness = false

[profile.release]
opt-level = "s"
debug = true

# The software hash loop of the chipless T-Display-S3: speed over size, it is tiny.
[profile.release.package.warpaxe-cpuminer]
opt-level = 3

[profile.dev]
debug = true
opt-level = "z"

[dependencies]
log = "0.4"
esp-idf-svc = "0.51"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
heapless = "0.8"
hex = "0.4"
sha2 = { version = "0.10", default-features = false }
anyhow = "1"
warpaxe-core = { path = "../../crates/core" }
warpaxe-chain = { path = "../../crates/chain" }
warpaxe-board = { path = "../../crates/board" }
warpaxe-stratum = { path = "../../crates/stratum" }
warpaxe-sv2 = { path = "../../crates/sv2" }
# The T-Display-S3 without chips (src/cpuminer.rs): the ESP32-S3 hashes
# by itself, on its SHA engine and its second core.
warpaxe-cpuminer = { path = "../../crates/cpuminer" }

[build-dependencies]
embuild = "0.33"

[package.metadata.esp-idf-sys]
esp_idf_tools_install_dir = "global"
esp_idf_sdkconfig_defaults = ["sdkconfig.defaults"]

[[package.metadata.esp-idf-sys.extra_components]]
remote_component = { name = "espressif/mdns", version = "1.8" }

[[package.metadata.esp-idf-sys.extra_components]]
component_dirs = "../components"
bindings_header = "bindings.h"
bindings_module = "tusb"

# esp-idf-svc 0.51.0 with one change: unknown Wi-Fi events are logged and
# ignored instead of panicking (see vendor/esp-idf-svc/WARPAXE-PATCH.md).
[patch.crates-io]
esp-idf-svc = { path = "vendor/esp-idf-svc" }
