[package]
name = "warpaxe"
version = "0.1.44"
edition = "2021"
license = "GPL-3.0-or-later"
authors = ["dvb-projekt <oliver-mai@gmx.de>"]
description = "WarpAxe firmware for BM13xx miners on the ESP32-S3 (Bitaxe Gamma, NerdAxe/NerdQAxe family). Stage B: network over USB-C and Wi-Fi, AxeOS-compatible API, OTA, display; the chain driver from warpaxe-chain."
rust-version = "1.77"
publish = false

# Detached from the workspace on purpose: different target (xtensa), std on ESP-IDF.
[workspace]

[[bin]]
name = "warpaxe"
harness = false

[profile.release]
opt-level = "s"
debug = true

# The software hash loop of the chipless T-Display-S3: speed over size, it is tiny.
[profile.release.package.warpaxe-cpuminer]
opt-level = 3

[profile.dev]
debug = true
opt-level = "z"

[dependencies]
log = "0.4"
esp-idf-svc = "0.51"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
heapless = "0.8"
hex = "0.4"
sha2 = { version = "0.10", default-features = false }
anyhow = "1"
warpaxe-core = { path = "../../crates/core" }
warpaxe-chain = { path = "../../crates/chain" }
warpaxe-board = { path = "../../crates/board" }
warpaxe-stratum = { path = "../../crates/stratum" }
warpaxe-sv2 = { path = "../../crates/sv2" }
# The T-Display-S3 without chips (src/cpuminer.rs): the ESP32-S3 hashes
# by itself, on its SHA engine and its second core.
warpaxe-cpuminer = { path = "../../crates/cpuminer" }
# The display's choosable pages, cockpit places and OLED slides: names,
# defaults and the checks a PATCH has to pass.
warpaxe-displaycfg = { path = "../../crates/displaycfg" }
# The swarm page's Avalon: a read-only cgminer client and its
# translation into an AxeOS-like document.
warpaxe-avalon = { path = "../../crates/avalon" }
# The firmware writer's hand-off: one image at a time to the main task.
warpaxe-ota = { path = "../../crates/ota" }
warpaxe-trust = { path = "../../crates/trust" }
# The boot screen's pictures are in the image packed; this unpacks them.
warpaxe-inflate = { path = "../../crates/inflate" }
# The diagnostics file's privacy rules and the event log's ring.
warpaxe-diag = { path = "../../crates/diag" }

[build-dependencies]
embuild = "0.33"
# The web UI goes into the image gzip-compressed (build.rs): 290 KB of
# HTML with eight languages become 90 KB. Pure Rust (miniz_oxide).
flate2 = "1"

[features]
# The SHA peripheral bench of the T-Display-S3 (docs/06): measured once
# after start and on POST /api/v1/cpuminer/bench. Off in releases:
# `cargo build --release --features shabench` to measure.
shabench = []
# A test build only: POST /api/v1/diag/fragment takes the internal heap
# apart (many small blocks, every other one kept) until no 16 KB piece
# is left, to prove an update still goes through (docs/09).
fragtest = []

[package.metadata.esp-idf-sys]
esp_idf_tools_install_dir = "global"
esp_idf_sdkconfig_defaults = ["sdkconfig.defaults"]

[[package.metadata.esp-idf-sys.extra_components]]
remote_component = { name = "espressif/mdns", version = "1.8" }

[[package.metadata.esp-idf-sys.extra_components]]
component_dirs = "../components"
bindings_header = "bindings.h"
bindings_module = "tusb"

# esp-idf-svc 0.51.0 with one change: unknown Wi-Fi events are logged and
# ignored instead of panicking (see vendor/esp-idf-svc/WARPAXE-PATCH.md).
[patch.crates-io]
esp-idf-svc = { path = "vendor/esp-idf-svc" }
