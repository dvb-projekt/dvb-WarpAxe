[package]
name = "warpaxe-inflate"
description = "A small DEFLATE (RFC 1951) decoder that unpacks into a slice: the boot screen's pictures are stored packed in the firmware image and unpacked straight into the frame buffer when the splash is drawn. No allocation, no tables in static RAM, no panic on damaged input; host-tested against the raw pictures."
version.workspace = true
edition.workspace = true
license.workspace = true
authors.workspace = true

[lints]
workspace = true

[dependencies]

[dev-dependencies]
# The reference packer for the tests (pure Rust, miniz_oxide).
flate2 = "1"
