[package]
name = "warpaxe-trust"
description = "Trust in a root the TLS server sends along: a certificate whose subject and public key are a root of ESP-IDF's compact CA bundle is that root. No I/O; host-tested, the firmware's TLS verify callback runs it."
version.workspace = true
edition.workspace = true
license.workspace = true
authors.workspace = true

[lints]
workspace = true

[dependencies]
# SHA-256 of the pool's public key (SubjectPublicKeyInfo) for the pin;
# no_std, no default features, the same crate the firmware already builds.
sha2 = { version = "0.10", default-features = false }
