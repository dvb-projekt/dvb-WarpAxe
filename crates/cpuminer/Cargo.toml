[package]
name = "warpaxe-cpuminer"
description = "Hashing without a BM13xx, for the T-Display-S3 devkit: SHA-256 with a header midstate, the block layout the ESP32-S3's SHA peripheral eats, and the one-time import of a NerdMiner's Wi-Fi and wallet. Host-tested; the firmware brings the registers and the flash. A toy behind the firmware's `cpu-miner` feature, never in a release."
version.workspace = true
edition.workspace = true
license.workspace = true
authors.workspace = true

[lints]
workspace = true

[dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"
# Its block compressor is the software worker's hash: hand-unrolled, about
# three times the speed of the plain loop kept here for the tests.
sha2 = { version = "0.10", default-features = false, features = ["compress"] }

[dev-dependencies]
hex = "0.4"
warpaxe-stratum = { path = "../stratum" }
