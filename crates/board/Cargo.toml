[package]
name = "warpaxe-board"
description = "Board layer for WarpAxe: voltage regulator, thermal sensor, fan control and per-board profiles, no_std"
version.workspace = true
edition.workspace = true
license.workspace = true
authors.workspace = true

[dependencies]
# The permissively licensed drivers (MIT OR Apache-2.0) this crate builds on.
warpaxe-drivers = { path = "../drivers" }
# The EMC2101 driver (GPTechinno, MIT OR Apache-2.0); 4.1 brought the
# diode tuning, the PWM clock choice and the zero-count fix, 4.2 one
# Fan Config read instead of one per fan write.
emc2101 = { version = "4.2", default-features = false, features = ["sync"] }
# The crate's bounded integers for its fan step and ideality arguments.
bounded-integer = "0.6"

[dev-dependencies]
warpaxe-drivers = { path = "../drivers", features = ["mock"] }

[lints]
workspace = true
