[package]
name = "warpaxe-sv2"
description = "Stratum V2 mining client without sockets: Noise handshake, encrypted framing, messages and the extended-channel state machine"
version.workspace = true
edition.workspace = true
license.workspace = true
authors.workspace = true

[lints]
workspace = true

[dependencies]
# The same Noise implementation the WarpPool server speaks
# (Noise_NX_Secp256k1+EllSwift_ChaChaPoly_SHA256, Schnorr-signed cert).
noise_sv2 = "1.4.2"
# noise_sv2's key type for the authority key; same major, same type.
secp256k1 = { version = "0.28", default-features = false }
# Small precomputed tables: the ESP32-S3 has 3 MiB of app flash, not 4 MB
# of them. Features unify, so the host tests run with the same tables.
secp256k1-sys = { version = "0.9", default-features = false, features = ["lowmemory"] }
sha2 = { version = "0.10", default-features = false }
warpaxe-stratum = { path = "../stratum" }

[dev-dependencies]
# Authority keys for the handshake tests (the pool side, `Responder`).
secp256k1 = { version = "0.28", default-features = false, features = ["alloc"] }
