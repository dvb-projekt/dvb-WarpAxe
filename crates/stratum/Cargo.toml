[package]
name = "warpaxe-stratum"
description = "Stratum V1 as data: message parsing and building, coinbase and merkle root, header fields for the chip. No I/O; the firmware and the tests bring the socket."
version.workspace = true
edition.workspace = true
license.workspace = true
authors.workspace = true

[lints]
workspace = true

[dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = "0.10"
hex = "0.4"
warpaxe-chain = { path = "../chain" }
