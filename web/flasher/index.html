<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>WarpAxe Flasher</title>
<link rel="icon" href="favicon.svg">
<style>
:root{--void:#05060B;--deep:#0F1226;--warp:#7B5CFF;--plasma:#00E0FF;--fg:#E8EEF7;--mute:#9CA8BD;--ok:#50E3A4;--warn:#F5B942;--err:#FF5A5A;--line:rgba(255,255,255,.08);--card:rgba(15,18,38,.78);color-scheme:dark}
*{box-sizing:border-box}
[hidden]{display:none!important}
html{background:var(--void)}
body{margin:0;color:var(--fg);font:15px/1.55 Inter,-apple-system,system-ui,sans-serif;background:radial-gradient(ellipse 80% 45% at 50% -10%,rgba(123,92,255,.18),transparent 60%),var(--void);-webkit-font-smoothing:antialiased}
a{color:var(--plasma)}
main{max-width:760px;margin:0 auto;padding:32px 20px 56px;display:flex;flex-direction:column;gap:18px}
header{display:flex;align-items:center;gap:16px;flex-wrap:wrap}
header img{height:40px;width:auto}
.grow{flex:1}
h1,h2{font-family:"Space Grotesk",Inter,sans-serif;letter-spacing:-.02em;margin:0}
h1{font-size:28px}h2{font-size:17px}
.card{background:var(--card);border:1px solid var(--line);border-radius:16px;padding:20px 22px;display:flex;flex-direction:column;gap:10px}
.card p,.card ol,.card ul{margin:0}
ol,ul{padding-left:20px;display:flex;flex-direction:column;gap:6px}
.mute{color:var(--mute)}
.warn{border-color:rgba(245,185,66,.4)}
.warn h2{color:var(--warn)}
code{font-family:"JetBrains Mono",ui-monospace,monospace;font-size:13px;background:rgba(255,255,255,.06);padding:1px 5px;border-radius:5px}
.install{align-items:flex-start}
.btn{display:inline-block;padding:12px 22px;border:0;border-radius:12px;background:var(--warp);color:#fff;font:600 15px Inter,system-ui,sans-serif;cursor:pointer}
.btn:hover{filter:brightness(1.12)}
.ver{font-family:"JetBrains Mono",ui-monospace,monospace;font-size:13px;color:var(--mute)}
.lang{height:34px;padding:0 8px;border-radius:10px;border:1px solid rgba(255,255,255,.14);background:transparent;color:var(--fg);font:inherit}
.nosupport{color:var(--err)}
.btn:disabled{opacity:.5;cursor:default;filter:none}
.prog{width:100%;height:8px;border-radius:99px;background:rgba(255,255,255,.08);overflow:hidden}
.prog>div{height:100%;width:0;background:linear-gradient(90deg,var(--warp),var(--plasma));transition:width .2s}
.status{min-height:1.5em}
.status.ok{color:var(--ok)}.status.err{color:var(--err)}
</style>
</head>
<body>
<main>
  <header>
    <img src="wordmark.webp" alt="WarpAxe">
    <div class="grow"></div>
    <select class="lang" id="lang" aria-label="Language">
      <option value="en">English</option>
      <option value="de">Deutsch</option>
      <option value="es">Español</option>
      <option value="fr">Français</option>
      <option value="it">Italiano</option>
      <option value="pt">Português (Brasil)</option>
      <option value="ja">日本語</option>
      <option value="zh">中文</option>
    </select>
  </header>

  <h1 data-t="title"></h1>
  <p class="mute" data-t="intro"></p>

  <section class="card warn">
    <h2 data-t="warn_h"></h2>
    <ul>
      <li data-t="warn_early"></li>
      <li data-t="warn_boards"></li>
      <li data-t="warn_backup"></li>
    </ul>
  </section>

  <section class="card">
    <h2 data-t="prep_h"></h2>
    <ol>
      <li data-t="prep_browser"></li>
      <li data-t="prep_gamma"></li>
      <li data-t="prep_nerd"></li>
      <li data-t="prep_again"></li>
    </ol>
  </section>

  <section class="card install">
    <h2 data-t="inst_h"></h2>
    <p data-t="inst_keep"></p>
    <button class="btn" id="go" data-t="inst_btn"></button>
    <div class="prog" id="prog" hidden><div id="bar"></div></div>
    <p class="status" id="st" aria-live="polite"></p>
    <p class="nosupport" id="nos" hidden></p>
    <span class="ver" id="ver"></span>
    <p class="mute" data-t="help_stuck"></p>
  </section>

  <section class="card">
    <h2 data-t="after_h"></h2>
    <ol>
      <li data-t="after_start"></li>
      <li data-t="after_ui"></li>
      <li data-t="after_update"></li>
    </ol>
  </section>

  <p class="mute" data-t="foot"></p>
</main>

let version = "";
function apply(lang) {
  const t = T[lang] || T.en;
  document.documentElement.lang = lang;
  document.querySelectorAll("[data-t]").forEach(el => { el.innerHTML = t[el.dataset.t]; });
  document.getElementById("ver").textContent = version ? t.ver.replace("{v}", version) : "";
}
const sel = document.getElementById("lang");
let lang = (navigator.language || "en").slice(0, 2);
try { lang = localStorage.getItem("warpaxe-flasher-lang") || lang; } catch (e) {}
if (!T[lang]) lang = "en";
sel.value = lang;
sel.addEventListener("change", () => {
  try { localStorage.setItem("warpaxe-flasher-lang", sel.value); } catch (e) {}
  apply(sel.value);
});
apply(lang);
fetch("manifest.json").then(r => r.json()).then(m => { version = m.version; apply(sel.value); }).catch(() => {});

// The install: esptool-js over Web Serial. Writes the manifest's parts
// (bootloader, partition table, empty OTA data, app), never the NVS
// partition, checks each part's MD5 against the flash, then clears the
// forced-download flag (set by /bootloader, it survives resets) and
// restarts the chip with the RTC watchdog — the sequence esptool uses on
// the ESP32-S3.
const RTC = 0x60008000;
const $ = (id) => document.getElementById(id);
function st(key, vars = {}, cls = "") {
  const t = T[sel.value] || T.en;
  let s = t[key] || T.en[key];
  for (const [k, v] of Object.entries(vars)) s = s.replace("{" + k + "}", v);
  $("st").textContent = s;
  $("st").className = "status " + cls;
}
if (!("serial" in navigator)) {
  $("go").disabled = true;
  $("nos").hidden = false;
  $("nos").dataset.t = "unsupported";
  apply(sel.value);
}
$("go").addEventListener("click", async () => {
  let port;
  st("st_pick");
  try {
    port = await navigator.serial.requestPort({ filters: [{ usbVendorId: 0x303a }] });
  } catch (e) {
    st("st_cancel", {}, "err");
    return;
  }
  $("go").disabled = true;
  const transport = new Transport(port, false);
  let stage = "connect";
  try {
    st("st_connect");
    const loader = new ESPLoader({ transport, baudrate: 921600, romBaudrate: 115200 });
    let chip;
    try {
      chip = await loader.main("default_reset");
    } catch (e) {
      stage = "nodl";
      throw e;
    }
    if (!/ESP32-S3/i.test(chip)) {
      st("st_wrongchip", { chip }, "err");
      return;
    }
    st("st_chip", { chip });
    stage = "write";
    const m = await (await fetch("manifest.json", { cache: "no-store" })).json();
    const parts = m.builds.find((b) => b.chipFamily === "ESP32-S3").parts;
    const files = [];
    for (const p of parts) {
      const r = await fetch(p.path, { cache: "no-store" });
      if (!r.ok) throw new Error(p.path + ": HTTP " + r.status);
      files.push({ data: new Uint8Array(await r.arrayBuffer()), address: p.offset });
    }
    const total = files.reduce((n, f) => n + f.data.length, 0);
    const done = files.map(() => 0);
    $("prog").hidden = false;
    await loader.writeFlash({
      fileArray: files,
      flashSize: "keep",
      flashMode: "keep",
      flashFreq: "keep",
      eraseAll: false,
      compress: true,
      reportProgress: (i, written, size) => {
        done[i] = (written / size) * files[i].data.length;
        const pct = Math.floor((done.reduce((a, b) => a + b, 0) / total) * 100);
        $("bar").style.width = pct + "%";
        st("st_write", { p: pct });
      },
      calculateMD5Hash: md5hex,
    });
    stage = "restart";
    st("st_restart");
    await loader.writeReg(RTC + 0x12c, 0, 0x1);
    await loader.writeReg(RTC + 0xb0, 0x50d83aa1);
    await loader.writeReg(RTC + 0x9c, 2000);
    await loader.writeReg(RTC + 0x98, ((1 << 31) | (5 << 28) | (1 << 8) | 2) >>> 0);
    try { await loader.writeReg(RTC + 0xb0, 0); } catch (e) { /* the chip may already be resetting */ }
    st("st_done", { v: version || m.version }, "ok");
  } catch (e) {
    if (stage === "restart") st("st_done", { v: version }, "ok");
    else if (stage === "nodl") st("st_nodl", {}, "err");
    else st("st_error", { e: (e && e.message) || String(e) }, "err");
  } finally {
    try { await transport.disconnect(); } catch (e) {}
    $("go").disabled = false;
  }
});
