<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>WarpAxe — open-source firmware for Bitaxe and Nerd miners</title>
<meta name="description" content="One firmware image for Bitaxe, NerdAxe, NerdQAxe++, NerdOctaxe and BitForge Nano: signed updates with rollback, an AxeOS-compatible API, and a browser installer that backs up your stock firmware first.">
<meta property="og:title" content="WarpAxe — open-source firmware for Bitaxe and Nerd miners">
<meta property="og:description" content="Signed updates with rollback, an AxeOS-compatible API, one image for all boards. Install from the browser, with a full backup first.">
<meta property="og:image" content="https://warppool.org/warpaxe/og.jpg">
<meta property="og:url" content="https://warppool.org/warpaxe/">
<link rel="icon" href="favicon.svg">
<style>
:root{--void:#05060B;--deep:#0F1226;--warp:#7B5CFF;--plasma:#00E0FF;--fg:#E8EEF7;--mute:#9CA8BD;--ok:#50E3A4;--warn:#F5B942;--err:#FF5A5A;--line:rgba(255,255,255,.08);--card:rgba(15,18,38,.78);color-scheme:dark}
*{box-sizing:border-box}
[hidden]{display:none!important}
html{background:var(--void)}
body{margin:0;color:var(--fg);font:15px/1.55 Inter,-apple-system,system-ui,sans-serif;background:radial-gradient(ellipse 80% 45% at 50% -10%,rgba(123,92,255,.18),transparent 60%),var(--void);-webkit-font-smoothing:antialiased}
a{color:var(--plasma)}
main{max-width:760px;margin:0 auto;padding:32px 20px 56px;display:flex;flex-direction:column;gap:18px}
header{display:flex;align-items:center;gap:16px;flex-wrap:wrap}
header img{height:40px;width:auto}
.grow{flex:1}
h1,h2{font-family:"Space Grotesk",Inter,sans-serif;letter-spacing:-.02em;margin:0}
h1{font-size:28px}h2{font-size:17px}
.card{background:var(--card);border:1px solid var(--line);border-radius:16px;padding:20px 22px;display:flex;flex-direction:column;gap:10px}
.card p,.card ol,.card ul{margin:0}
ol,ul{padding-left:20px;display:flex;flex-direction:column;gap:6px}
.mute{color:var(--mute)}
.warn{border-color:rgba(245,185,66,.4)}
.warn h2{color:var(--warn)}
code{font-family:"JetBrains Mono",ui-monospace,monospace;font-size:13px;background:rgba(255,255,255,.06);padding:1px 5px;border-radius:5px}
.install{align-items:flex-start}
.btn{display:inline-block;padding:12px 22px;border:0;border-radius:12px;background:var(--warp);color:#fff;font:600 15px Inter,system-ui,sans-serif;cursor:pointer}
.btn:hover{filter:brightness(1.12)}
.ver{font-family:"JetBrains Mono",ui-monospace,monospace;font-size:13px;color:var(--mute)}
.lang{height:34px;padding:0 8px;border-radius:10px;border:1px solid rgba(255,255,255,.14);background:transparent;color:var(--fg);font:inherit}
.nosupport{color:var(--err)}
.btn:disabled{opacity:.5;cursor:default;filter:none}
.prog{width:100%;height:8px;border-radius:99px;background:rgba(255,255,255,.08);overflow:hidden}
.prog>div{height:100%;width:0;background:linear-gradient(90deg,var(--warp),var(--plasma));transition:width .2s}
.status{min-height:1.5em}
.status.ok{color:var(--ok)}.status.err{color:var(--err)}
.bk{display:flex;gap:10px;align-items:flex-start;cursor:pointer}
.bk input{margin-top:4px;width:17px;height:17px;accent-color:var(--warp);flex:none}
.btn.alt{background:transparent;border:1px solid var(--warp)}
.top{max-width:1000px;margin:0 auto;padding:24px 20px 0}
.lp{max-width:1000px;margin:0 auto;padding:24px 20px 8px;display:flex;flex-direction:column;gap:22px}
.hero{display:grid;grid-template-columns:1fr minmax(0,300px);gap:32px;align-items:center}
.hero h1{font-size:clamp(28px,4.6vw,40px);line-height:1.15;text-wrap:balance}
.hero h1 em{font-style:normal;color:var(--plasma)}
.hero .sub{color:var(--mute);font-size:16px;margin:14px 0 0;max-width:56ch}
.hero .sub strong{color:var(--warn);font-weight:600}
.cta{display:flex;gap:10px;flex-wrap:wrap;margin-top:20px}
a.btn{text-decoration:none}
.btn.ghost{background:rgba(255,255,255,.04);border:1px solid rgba(255,255,255,.14);color:var(--fg)}
.badges{display:flex;gap:6px;flex-wrap:wrap;margin-top:16px}
.badge{font-size:12px;overflow-wrap:anywhere;color:var(--mute);border:1px solid var(--line);border-radius:99px;padding:3px 10px}
figure{margin:0;text-align:center}
figure img{width:100%;max-width:300px;height:auto;filter:drop-shadow(0 0 40px rgba(123,92,255,.28))}
figcaption{color:var(--mute);font-size:13px;margin-top:6px}
.feat{display:grid;grid-template-columns:repeat(auto-fit,minmax(min(270px,100%),1fr));gap:14px}
.feat .card{gap:6px}
.feat h3{margin:0;font:600 16px "Space Grotesk",Inter,sans-serif}
.feat .ico{font-size:22px;line-height:1}
.feat p{color:var(--mute);font-size:14px}
.honest{border-left:4px solid var(--warn)}
.honest strong{color:var(--fg)}
.links{display:flex;gap:18px;flex-wrap:wrap;font-size:14px}
.sep{border:0;border-top:1px solid var(--line);margin:8px 0 0}
@media (max-width:700px){.hero{grid-template-columns:1fr}.hero figure{order:-1}figure img{max-width:200px}}
</style>
</head>
<body>
<div class="top">
  <header>
    <img src="wordmark.webp" alt="WarpAxe">
    <div class="grow"></div>
    <select class="lang" id="lang" aria-label="Language">
      <option value="en">English</option>
      <option value="de">Deutsch</option>
      <option value="es">Español</option>
      <option value="fr">Français</option>
      <option value="it">Italiano</option>
      <option value="pt">Português (Brasil)</option>
      <option value="ja">日本語</option>
      <option value="zh">中文</option>
    </select>
  </header>
</div>

<div class="lp">
  <div class="hero">
    <div>
      <h1 data-t="lp_h"></h1>
      <p class="sub" data-t="lp_sub"></p>
      <div class="cta">
        <a class="btn" href="#install" data-t="lp_go"></a>
        <a class="btn ghost" id="lpman" href="https://docs.warppool.org/warpaxe-guide.html" data-t="lp_man"></a>
        <a class="btn ghost" href="https://git.warppool.org/dvb-projekt/dvb-WarpAxe" data-t="lp_src"></a>
      </div>
      <div class="badges">
        <span class="badge">Bitaxe · NerdAxe · NerdQAxe++ · NerdOctaxe · BitForge Nano</span>
        <span class="badge">Stratum V2</span>
        <span class="badge" data-t="lp_b_lang"></span>
        <span class="badge">GPL-3.0</span>
      </div>
    </div>
    <figure>
      <img src="gaia.webp" width="560" height="700" data-ta="lp_img_alt">
      <figcaption data-t="lp_img_cap"></figcaption>
    </figure>
  </div>

  <div class="feat">
    <div class="card"><div class="ico">🧩</div><h3 data-t="lp_c1h"></h3><p data-t="lp_c1p"></p></div>
    <div class="card"><div class="ico">🔏</div><h3 data-t="lp_c2h"></h3><p data-t="lp_c2p"></p></div>
    <div class="card"><div class="ico">🔌</div><h3 data-t="lp_c3h"></h3><p data-t="lp_c3p"></p></div>
    <div class="card"><div class="ico">💾</div><h3 data-t="lp_c4h"></h3><p data-t="lp_c4p"></p></div>
    <div class="card"><div class="ico">📟</div><h3 data-t="lp_c5h"></h3><p data-t="lp_c5p"></p></div>
    <div class="card"><div class="ico">🌡️</div><h3 data-t="lp_c6h"></h3><p data-t="lp_c6p"></p></div>
  </div>

  <div class="card honest"><p data-t="lp_honest"></p></div>
  <p class="links"><span data-t="lp_tune"></span></p>
  <hr class="sep">
</div>

<main id="install">
  <h1 data-t="title"></h1>
  <p class="mute" data-t="intro"></p>
  <p data-t="manual"></p>

  <section class="card warn">
    <h2 data-t="warn_h"></h2>
    <ul>
      <li data-t="warn_early"></li>
      <li data-t="warn_boards"></li>
      <li data-t="warn_backup"></li>
    </ul>
  </section>

  <section class="card">
    <h2 data-t="prep_h"></h2>
    <ol>
      <li data-t="prep_browser"></li>
      <li data-t="prep_gamma"></li>
      <li data-t="prep_nerd"></li>
      <li data-t="prep_again"></li>
    </ol>
  </section>

  <section class="card install">
    <h2 data-t="inst_h"></h2>
    <p data-t="inst_keep"></p>
    <label class="bk" id="bkrow"><input type="checkbox" id="bk" checked><span><span data-t="bk_label"></span><br><span class="mute" data-t="bk_hint"></span></span></label>
    <button class="btn" id="go" data-t="inst_btn"></button>
    <button class="btn alt" id="go2" data-t="inst_continue" hidden></button>
    <div class="prog" id="prog" hidden><div id="bar"></div></div>
    <p class="status" id="st" aria-live="polite"></p>
    <p class="nosupport" id="nos" hidden></p>
    <span class="ver" id="ver"></span>
    <p class="mute" data-t="help_stuck"></p>
  </section>

  <section class="card install" id="restore">
    <h2 data-t="rs_h"></h2>
    <p data-t="rs_intro"></p>
    <label class="mute" for="rsfile" data-t="rs_pick"></label>
    <input type="file" id="rsfile" accept=".bin,application/octet-stream">
    <button class="btn alt" id="rsgo" data-t="rs_btn" disabled></button>
    <div class="prog" id="rsprog" hidden><div id="rsbar"></div></div>
    <p class="status" id="rsst" aria-live="polite"></p>
  </section>

  <section class="card">
    <h2 data-t="after_h"></h2>
    <ol>
      <li data-t="after_start"></li>
      <li data-t="after_ui"></li>
      <li data-t="after_update"></li>
    </ol>
  </section>

  <p class="mute" data-t="foot"></p>
  <p class="mute" data-t="foot_discord"></p>
</main>

  fr: {

    lp_c3p: "Une API compatible AxeOS : WarpTune et les outils que vous utilisez avec AxeOS continuent de fonctionner. Les réglages Wi-Fi, pools, fréquence, tension et ventilateur sont repris au premier démarrage, et le mineur est accessible à l’adresse <code>&lt;nom&gt;.local</code>.",

      flashMode: "keep",
      flashFreq: "keep",
      eraseAll: false,
      compress: true,
      reportProgress: (i, written, total) => {
        const pct = Math.floor((written / total) * 100);
        $("rsbar").style.width = pct + "%";
        st("st_rswrite", { p: pct }, "", "rsst");
      },
      calculateMD5Hash: md5hex,
    });
    stage = "restart";
    await restartChip(loader);
    st("st_rsdone", {}, "ok", "rsst");
  } catch (e) {
    if (stage === "restart") st("st_rsdone", {}, "ok", "rsst");
    else if (stage === "nodl") st("st_nodl", {}, "err", "rsst");
    else st("st_rserr", { e: (e && e.message) || String(e) }, "err", "rsst");
  } finally {
    try { await transport.disconnect(); } catch (e) {}
    $("rsgo").disabled = !rsImage;
    $("go").disabled = false;
  }
});
if (location.hash === "#restore") $("restore").scrollIntoView();
</script>
</body>
</html>
