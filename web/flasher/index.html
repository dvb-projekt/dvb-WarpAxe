<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>WarpAxe Flasher</title>
<link rel="icon" href="favicon.svg">
<style>
:root{--void:#05060B;--deep:#0F1226;--warp:#7B5CFF;--plasma:#00E0FF;--fg:#E8EEF7;--mute:#9CA8BD;--ok:#50E3A4;--warn:#F5B942;--err:#FF5A5A;--line:rgba(255,255,255,.08);--card:rgba(15,18,38,.78);color-scheme:dark}
*{box-sizing:border-box}
[hidden]{display:none!important}
html{background:var(--void)}
body{margin:0;color:var(--fg);font:15px/1.55 Inter,-apple-system,system-ui,sans-serif;background:radial-gradient(ellipse 80% 45% at 50% -10%,rgba(123,92,255,.18),transparent 60%),var(--void);-webkit-font-smoothing:antialiased}
a{color:var(--plasma)}
main{max-width:760px;margin:0 auto;padding:32px 20px 56px;display:flex;flex-direction:column;gap:18px}
header{display:flex;align-items:center;gap:16px;flex-wrap:wrap}
header img{height:40px;width:auto}
.grow{flex:1}
h1,h2{font-family:"Space Grotesk",Inter,sans-serif;letter-spacing:-.02em;margin:0}
h1{font-size:28px}h2{font-size:17px}
.card{background:var(--card);border:1px solid var(--line);border-radius:16px;padding:20px 22px;display:flex;flex-direction:column;gap:10px}
.card p,.card ol,.card ul{margin:0}
ol,ul{padding-left:20px;display:flex;flex-direction:column;gap:6px}
.mute{color:var(--mute)}
.warn{border-color:rgba(245,185,66,.4)}
.warn h2{color:var(--warn)}
code{font-family:"JetBrains Mono",ui-monospace,monospace;font-size:13px;background:rgba(255,255,255,.06);padding:1px 5px;border-radius:5px}
.install{align-items:flex-start}
.btn{display:inline-block;padding:12px 22px;border:0;border-radius:12px;background:var(--warp);color:#fff;font:600 15px Inter,system-ui,sans-serif;cursor:pointer}
.btn:hover{filter:brightness(1.12)}
.ver{font-family:"JetBrains Mono",ui-monospace,monospace;font-size:13px;color:var(--mute)}
.lang{height:34px;padding:0 8px;border-radius:10px;border:1px solid rgba(255,255,255,.14);background:transparent;color:var(--fg);font:inherit}
.nosupport{color:var(--err)}
.btn:disabled{opacity:.5;cursor:default;filter:none}
.prog{width:100%;height:8px;border-radius:99px;background:rgba(255,255,255,.08);overflow:hidden}
.prog>div{height:100%;width:0;background:linear-gradient(90deg,var(--warp),var(--plasma));transition:width .2s}
.status{min-height:1.5em}
.status.ok{color:var(--ok)}.status.err{color:var(--err)}
.bk{display:flex;gap:10px;align-items:flex-start;cursor:pointer}
.bk input{margin-top:4px;width:17px;height:17px;accent-color:var(--warp);flex:none}
.btn.alt{background:transparent;border:1px solid var(--warp)}
</style>
</head>
<body>
<main>
  <header>
    <img src="wordmark.webp" alt="WarpAxe">
    <div class="grow"></div>
    <select class="lang" id="lang" aria-label="Language">
      <option value="en">English</option>
      <option value="de">Deutsch</option>
      <option value="es">Español</option>
      <option value="fr">Français</option>
      <option value="it">Italiano</option>
      <option value="pt">Português (Brasil)</option>
      <option value="ja">日本語</option>
      <option value="zh">中文</option>
    </select>
  </header>

  <h1 data-t="title"></h1>
  <p class="mute" data-t="intro"></p>

  <section class="card warn">
    <h2 data-t="warn_h"></h2>
    <ul>
      <li data-t="warn_early"></li>
      <li data-t="warn_boards"></li>
      <li data-t="warn_backup"></li>
    </ul>
  </section>

  <section class="card">
    <h2 data-t="prep_h"></h2>
    <ol>
      <li data-t="prep_browser"></li>
      <li data-t="prep_gamma"></li>
      <li data-t="prep_nerd"></li>
      <li data-t="prep_again"></li>
    </ol>
  </section>

  <section class="card install">
    <h2 data-t="inst_h"></h2>
    <p data-t="inst_keep"></p>
    <label class="bk" id="bkrow"><input type="checkbox" id="bk" checked><span><span data-t="bk_label"></span><br><span class="mute" data-t="bk_hint"></span></span></label>
    <button class="btn" id="go" data-t="inst_btn"></button>
    <button class="btn alt" id="go2" data-t="inst_continue" hidden></button>
    <div class="prog" id="prog" hidden><div id="bar"></div></div>
    <p class="status" id="st" aria-live="polite"></p>
    <p class="nosupport" id="nos" hidden></p>
    <span class="ver" id="ver"></span>
    <p class="mute" data-t="help_stuck"></p>
  </section>

  <section class="card install" id="restore">
    <h2 data-t="rs_h"></h2>
    <p data-t="rs_intro"></p>
    <label class="mute" for="rsfile" data-t="rs_pick"></label>
    <input type="file" id="rsfile" accept=".bin,application/octet-stream">
    <button class="btn alt" id="rsgo" data-t="rs_btn" disabled></button>
    <div class="prog" id="rsprog" hidden><div id="rsbar"></div></div>
    <p class="status" id="rsst" aria-live="polite"></p>
  </section>

  <section class="card">
    <h2 data-t="after_h"></h2>
    <ol>
      <li data-t="after_start"></li>
      <li data-t="after_ui"></li>
      <li data-t="after_update"></li>
    </ol>
  </section>

  <p class="mute" data-t="foot"></p>
</main>

  throw new Error("read flash: the stub no longer answers");
}
// The stub takes a 4-byte frame as a command when it is not inside a flash
// read (after a lost byte, say): the count 0xD000 is the frame 00 D0 00 00,
// a valid ERASE_FLASH. Blocks stay below 0xC000 bytes, so every count the
// acknowledgements carry is below 0xC000 and no byte of it is an opcode that
// writes; the one that ends a read is 0x7fffffff, which no opcode matches.
async function ack(loader, n) {
  const a = new Uint8Array(4);
  new DataView(a.buffer).setUint32(0, n, true);
  await loader.transport.write(a);
}
async function readBlock(loader, addr, size, onProgress) {
  const arg = new Uint8Array(16), v = new DataView(arg.buffer);
  v.setUint32(0, addr, true); v.setUint32(4, size, true); v.setUint32(8, DIAG.pkt, true); v.setUint32(12, DIAG.fly, true);
  await loader.checkCommand("read flash", loader.ESP_READ_FLASH, arg);
  const data = new Uint8Array(size);
  let got = 0;
  while (got < size) {
    const p = await readFrame(loader.transport, 1500);
    if (got + p.length > size) throw new Error("read flash: more data than asked for");
    data.set(p, got);
    got += p.length;
    await ack(loader, got < size ? got : 0x7fffffff);
    onProgress(got);
  }
  const digest = await readFrame(loader.transport, 1500);
  if (!(digest instanceof Uint8Array) || digest.length !== 16) throw new Error("read flash: no MD5 after the data");
  return { data, md5: Array.from(digest, (b) => b.toString(16).padStart(2, "0")).join("") };
}
async function backup(loader, target) {
  const size = loader.flashSizeBytes(await loader.detectFlashSize());
  if (!(size > 0)) throw new Error("flash size not detected");
  const out = target.handle ? await target.handle.createWritable() : null;
  const parts = [];
  const stat = { t0: Date.now(), blocks: 0, retries: 0, md5: 0 };
  $("prog").hidden = false;
  try {
    for (let a = 0; a < size; a += BLOCK) {
      const n = Math.min(BLOCK, size - a);
      let data = null;
      for (let tries = 0; tries < 8 && !data; tries++) {
        let got;
        try {
          got = await readBlock(loader, a, n, (done) => {
          const pct = Math.floor(((a + done) / size) * 100);
          $("bar").style.width = pct + "%";
          st("st_bkread", { p: pct });
          });
        } catch (e) {
          stat.retries++;
          console.log("backup: block 0x" + a.toString(16) + " try " + (tries + 1) + ": " + (e && e.message));
          if (tries === 7) throw e;
          await resync(loader);
          continue;
        }
        if (md5hex(got.data) === got.md5) data = got.data;
        else { stat.md5++; console.log("backup: block 0x" + a.toString(16) + " try " + (tries + 1) + ": MD5 differs"); }
      }
      if (!data) throw new Error("block at 0x" + a.toString(16) + " reads differently three times");
      stat.blocks++;
      if (out) await out.write(data);
      else parts.push(data);
    }
    if (out) await out.close();
    const s = (Date.now() - stat.t0) / 1000;
    console.log("backup: " + stat.blocks + " blocks of " + BLOCK + " B, pkt " + DIAG.pkt + ", fly " + DIAG.fly + ": " + s.toFixed(1) + " s, " + (size / 1024 / s).toFixed(0) + " KB/s, " + stat.retries + " retries, " + stat.md5 + " MD5 mismatches");
  } catch (e) {
    if (out) { try { await out.abort(); } catch (x) {} }
    throw e;
  }
  let name = target.handle ? target.handle.name : `miner-backup-${today()}.bin`;
  if (!target.handle) {
    const a = document.createElement("a");
    a.href = URL.createObjectURL(new Blob(parts, { type: "application/octet-stream" }));
    a.download = name;
    document.body.appendChild(a); a.click(); a.remove();
    setTimeout(() => URL.revokeObjectURL(a.href), 60000);
  }
  return { name, mb: Math.round(size / 1048576) };
}
async function install(port, target) {
  $("go").disabled = true;
  $("go2").hidden = true;
  const transport = new Transport(port, DIAG.trace);
  let stage = "connect";
  try {
    st("st_connect");
    const loader = new ESPLoader({ transport, baudrate: DIAG.baud, romBaudrate: 115200, serialOptions: SERIAL });
    let chip;
    try {
      chip = await loader.main("default_reset");
    } catch (e) {
      stage = "nodl";
      throw e;
    }
    if (!/ESP32-S3/i.test(chip)) {
      st("st_wrongchip", { chip }, "err");
      return;
    }
    let saved = null;
    if (target) {
      stage = "backup";
      saved = await backup(loader, target);
      if (DIAG.only) {
        // ?backuponly: diagnosis, read the flash and restart, write nothing
        stage = "restart";
        st("st_restart");
        await restartChip(loader);
        st("st_bkdone", { f: saved.name, mb: saved.mb }, "ok");
        return;
      }
    }
    stage = "load";
    st(saved ? "st_bkdone" : "st_chip", saved ? { f: saved.name, mb: saved.mb } : { chip });
    const m = await (await fetch("manifest.json", { cache: "no-store" })).json();
    const parts = m.builds.find((b) => b.chipFamily === "ESP32-S3").parts;
    const files = [];
    for (const p of parts) {
      const r = await fetch(p.path, { cache: "no-store" });
      if (!r.ok) throw new Error(p.path + ": HTTP " + r.status);
      files.push({ data: new Uint8Array(await r.arrayBuffer()), address: p.offset });
    }
    stage = "write";
    const total = files.reduce((n, f) => n + f.data.length, 0);
    const done = files.map(() => 0);
    $("prog").hidden = false;
    $("bar").style.width = "0%";
    await loader.writeFlash({
      fileArray: files,
      flashSize: "keep",
      flashMode: "keep",
      flashFreq: "keep",
      eraseAll: false,
      compress: true,
      reportProgress: (i, written, size) => {
        done[i] = (written / size) * files[i].data.length;
        const pct = Math.floor((done.reduce((a, b) => a + b, 0) / total) * 100);
        $("bar").style.width = pct + "%";
        st("st_write", { p: pct });
      },
      calculateMD5Hash: md5hex,
    });
    stage = "restart";
    st("st_restart");
    await restartChip(loader);
    st(saved ? "st_done_bk" : "st_done", { v: version || m.version, f: saved && saved.name }, "ok");
  } catch (e) {
    const msg = (e && e.message) || String(e);
    if (stage === "restart") st("st_done", { v: version }, "ok");
    else if (stage === "nodl") st("st_nodl", {}, "err");
    else if (stage === "backup" || stage === "load") st(stage === "backup" ? "st_bkerr" : "st_loaderr", { e: msg }, "err");
    else st("st_error", { e: msg }, "err");
  } finally {
    try { await transport.disconnect(); } catch (e) {}
    $("go").disabled = false;
  }
}
async function restartChip(loader) {
  await loader.writeReg(RTC + 0x12c, 0, 0x1);
  await loader.writeReg(RTC + 0xb0, 0x50d83aa1);
  await loader.writeReg(RTC + 0x9c, 2000);
  await loader.writeReg(RTC + 0x98, ((1 << 31) | (5 << 28) | (1 << 8) | 2) >>> 0);
  try { await loader.writeReg(RTC + 0xb0, 0); } catch (e) { /* the chip may already be resetting */ }
}
const askPort = () => navigator.serial.requestPort({ filters: [{ usbVendorId: 0x303a }] });
let waiting = null;
$("go").addEventListener("click", async () => {
  let target = null;
  if ($("bk").checked) {
    st("st_bkpick");
    try {
      target = await pickBackup();
    } catch (e) {
      st("st_bkcancel", {}, "err");
      return;
    }
  }
  st("st_pick");
  let port;
  try {
    port = await askPort();
  } catch (e) {
    if (target && e && e.name === "SecurityError") {
      waiting = target;
      $("go2").hidden = false;
      st("st_needclick");
      return;
    }
    st("st_cancel", {}, "err");
    return;
  }
  await install(port, target);
});
$("go2").addEventListener("click", async () => {
  st("st_pick");
  let port;
  try {
    port = await askPort();
  } catch (e) {
    st("st_cancel", {}, "err");
    return;
  }
  const target = waiting;
  waiting = null;
  await install(port, target);
});

// The way back: a full-flash backup (from this page or tools/flash-backup.sh)
// goes back to offset 0 over USB, through the ROM loader, which no failed
// write can damage. The file must look like a whole flash (a power-of-two
// size of 2–32 MB, an ESP image at 0, the partition table at 0x8000) and
// match the miner's flash size; esptool-js checks the written data's MD5.
let rsImage = null;
$("rsfile").addEventListener("change", async () => {
  rsImage = null;
  $("rsgo").disabled = true;
  const f = $("rsfile").files[0];
  if (!f) return;
  const data = new Uint8Array(await f.arrayBuffer());
  const mb = data.length / 1048576;
  let why = "";
  if (![2, 4, 8, 16, 32].includes(mb)) why = "size " + data.length + " bytes";
  else if (data[0] !== 0xe9) why = "no bootloader at 0x0";
  else if (data[0x8000] !== 0xaa || data[0x8001] !== 0x50) why = "no partition table at 0x8000";
  if (why) { st("st_rsbad", { why }, "err", "rsst"); return; }
  rsImage = { data, name: f.name, mb };
  $("rsgo").disabled = false;
  st("st_rsready", { f: f.name, mb }, "", "rsst");
});
$("rsgo").addEventListener("click", async () => {
  if (!rsImage) return;
  st("st_pick", {}, "", "rsst");
  let port;
  try {
    port = await askPort();
  } catch (e) {
    st("st_cancel", {}, "err", "rsst");
    return;
  }
  $("rsgo").disabled = true;
  $("go").disabled = true;
  const transport = new Transport(port, false);
  let stage = "connect";
  try {
    st("st_connect", {}, "", "rsst");
    const loader = new ESPLoader({ transport, baudrate: 921600, romBaudrate: 115200, serialOptions: SERIAL });
    let chip;
    try {
      chip = await loader.main("default_reset");
    } catch (e) {
      stage = "nodl";
      throw e;
    }
    if (!/ESP32-S3/i.test(chip)) {
      st("st_wrongchip", { chip }, "err", "rsst");
      return;
    }
    const size = loader.flashSizeBytes(await loader.detectFlashSize());
    if (size !== rsImage.data.length) {
      st("st_rssize", { a: rsImage.mb, b: Math.round(size / 1048576) }, "err", "rsst");
      return;
    }
    stage = "write";
    $("rsprog").hidden = false;
    await loader.writeFlash({
      fileArray: [{ data: rsImage.data, address: 0 }],
      flashSize: "keep",
      flashMode: "keep",
      flashFreq: "keep",
      eraseAll: false,
      compress: true,
      reportProgress: (i, written, total) => {
        const pct = Math.floor((written / total) * 100);
        $("rsbar").style.width = pct + "%";
        st("st_rswrite", { p: pct }, "", "rsst");
      },
      calculateMD5Hash: md5hex,
    });
    stage = "restart";
    await restartChip(loader);
    st("st_rsdone", {}, "ok", "rsst");
  } catch (e) {
    if (stage === "restart") st("st_rsdone", {}, "ok", "rsst");
    else if (stage === "nodl") st("st_nodl", {}, "err", "rsst");
    else st("st_rserr", { e: (e && e.message) || String(e) }, "err", "rsst");
  } finally {
    try { await transport.disconnect(); } catch (e) {}
    $("rsgo").disabled = !rsImage;
    $("go").disabled = false;
  }
});
if (location.hash === "#restore") $("restore").scrollIntoView();
</script>
