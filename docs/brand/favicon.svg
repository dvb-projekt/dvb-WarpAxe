<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64">
  <defs>
    <radialGradient id="void" cx="50%" cy="45%" r="60%">
      <stop offset="0%" stop-color="#0F1226"/>
      <stop offset="100%" stop-color="#05060B"/>
    </radialGradient>
    <linearGradient id="axe" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#FFE38A"/>
      <stop offset="55%" stop-color="#F7931A"/>
      <stop offset="100%" stop-color="#E0600A"/>
    </linearGradient>
    <linearGradient id="arcOuter" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#F7931A" stop-opacity="0"/>
      <stop offset="25%" stop-color="#F7931A"/>
      <stop offset="50%" stop-color="#FFD27A"/>
      <stop offset="75%" stop-color="#F7931A"/>
      <stop offset="100%" stop-color="#F7931A" stop-opacity="0"/>
    </linearGradient>
    <linearGradient id="arcInner" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#3B82F6" stop-opacity="0"/>
      <stop offset="50%" stop-color="#00E0FF"/>
      <stop offset="100%" stop-color="#3B82F6" stop-opacity="0"/>
    </linearGradient>
    <radialGradient id="spark" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#FFFFFF"/>
      <stop offset="40%" stop-color="#9FF4FF"/>
      <stop offset="100%" stop-color="#00E0FF" stop-opacity="0"/>
    </radialGradient>
  </defs>
  <rect width="64" height="64" rx="14" fill="url(#void)"/>
  <!-- the swoosh under the wordmark: orange outer arc, blue inner arc, meeting in a point -->
  <path d="M5 44 Q32 46 32 57 Q32 46 59 44" fill="none" stroke="url(#arcOuter)" stroke-width="2.4" stroke-linecap="round"/>
  <path d="M12 45.5 Q30 47 32 53 Q34 47 52 45.5" fill="none" stroke="url(#arcInner)" stroke-width="2" stroke-linecap="round"/>
  <circle cx="32" cy="47.5" r="5" fill="url(#spark)"/>
  <!-- italic A, the wordmark's "Axe" -->
  <g transform="translate(32 40) skewX(-12)">
    <path d="M-15 0 L-4.5 -30 L4.5 -30 L15 0 L8.5 0 L6.4 -6.5 L-6.4 -6.5 L-8.5 0 Z M-4.6 -12 L4.6 -12 L0 -25 Z"
          fill="url(#axe)" fill-rule="evenodd" stroke="#1A0E00" stroke-width="1.6" stroke-linejoin="round"/>
  </g>
</svg>
