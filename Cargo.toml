[workspace]
resolver = "2"
members = ["crates/core", "crates/sim", "crates/axeos", "crates/cgminer"]
# crates/scenarios is detached on purpose (path dep on dvb-WarpPool); see its Cargo.toml.
exclude = ["crates/scenarios"]

[workspace.package]
version = "0.1.0"
edition = "2021"
license = "GPL-3.0-or-later"
authors = ["dvb-projekt <oliver-mai@gmx.de>"]

[workspace.lints.rust]
unsafe_code = "forbid"
missing_docs = "warn"

[workspace.lints.clippy]
all = "warn"
