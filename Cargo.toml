[workspace]
resolver = "2"
members = ["crates/core", "crates/chain", "crates/board", "crates/stratum", "crates/sv2", "crates/sim", "crates/simuart", "crates/axeos", "crates/cgminer", "crates/cpuminer", "crates/displaycfg", "crates/avalon", "crates/ota", "crates/diag"]
# crates/scenarios is detached on purpose (path dep on dvb-WarpPool); see its Cargo.toml.
exclude = ["crates/scenarios", "firmware/proof-usb"]
# firmware/* are Xtensa targets on ESP-IDF; each has its own [workspace].

[workspace.package]
version = "0.1.0"
edition = "2021"
license = "GPL-3.0-or-later"
authors = ["dvb-projekt <oliver-mai@gmx.de>"]

[workspace.lints.rust]
unsafe_code = "forbid"
missing_docs = "warn"

[workspace.lints.clippy]
all = "warn"
