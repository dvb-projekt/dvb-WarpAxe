name: CI

# Runs on Forgejo Actions (self-hosted runner "warppool-forge"), same
# pattern as dvb-WarpPool. Stage A is host-only: no Xtensa target yet.

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

env:
  CARGO_TERM_COLOR: always
  RUST_BACKTRACE: 1

jobs:
  # One job for the four host checks. The runner has capacity 1, so
  # matrix jobs ran one after another anyway, each paying checkout,
  # toolchain and cache restore again. Every step still runs after an
  # earlier one failed, so one run shows every finding.
  rust:
    name: Rust checks
    runs-on: ubuntu-latest
    steps:
      - uses: https://github.com/actions/checkout@v7

      - name: Install Rust toolchain
        uses: https://github.com/dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
          targets: thumbv7em-none-eabihf

      - name: Cache cargo
        uses: https://github.com/Swatinem/rust-cache@v2

      - name: Pinned CA bundle
        run: python3 tools/check-ca-bundle.py

      - name: Format check
        run: cargo fmt --all -- --check

      - name: Clippy
        if: ${{ !cancelled() }}
        run: cargo clippy --workspace --all-targets -- -D warnings

      - name: Test
        if: ${{ !cancelled() }}
        run: cargo test --workspace --verbose

      # The core crate must build without std. thumbv7em has no std at
      # all, so a successful build there proves it — no ESP toolchain needed.
      - name: no_std build of warpaxe-core, warpaxe-chain, warpaxe-board, warpaxe-drivers, warpaxe-ota, warpaxe-trust and warpaxe-inflate
        if: ${{ !cancelled() }}
        run: cargo build -p warpaxe-core -p warpaxe-chain -p warpaxe-board -p warpaxe-drivers -p warpaxe-ota -p warpaxe-trust -p warpaxe-inflate --target thumbv7em-none-eabihf

  # WarpTune's regulator against the simulator, in-process. A separate
  # package (detached from the workspace) with a git dependency on
  # dvb-WarpPool pinned to a commit — see crates/scenarios/Cargo.toml.
  scenarios:
    name: Regulator scenarios
    runs-on: ubuntu-latest
    steps:
      - uses: https://github.com/actions/checkout@v7
      - uses: https://github.com/dtolnay/rust-toolchain@stable
      - uses: https://github.com/Swatinem/rust-cache@v2
        with:
          workspaces: crates/scenarios
      - name: Scenarios
        run: cargo test --manifest-path crates/scenarios/Cargo.toml
